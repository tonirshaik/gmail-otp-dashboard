name: Apply patch
on:
  push:
    branches: [feat/settings-v2]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 apply_patch.py
      - run: |
          rm apply_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ui): settings as full page, add account from Accounts page, remove logout button"
          git push
