<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail OTP Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(18, 24, 38, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --gradient-primary: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --gradient-btn: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            --shadow-glow: 0 0 25px rgba(59, 130, 246, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(59, 130, 246, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(139, 92, 246, 0.12) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 32px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), var(--shadow-glow);
        }

        /* Hidden Utility Screen */
        .hidden { display: none !important; }

        /* Login Screen */
        .login-box {
            text-align: center;
        }

        .login-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }

        .login-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        /* Top Header Area */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            position: relative;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .settings-btn:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: var(--accent-blue);
            color: var(--accent-cyan);
            transform: rotate(45deg);
        }

        .settings-popup {
            display: none;
            position: absolute;
            top: 50px;
            right: 0;
            width: 320px;
            background: #111827;
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 100;
            animation: fadeIn 0.2s ease-in-out;
        }

        .settings-popup.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .popup-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-cyan);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
        }

        .input-group { margin-bottom: 12px; }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus { border-color: var(--accent-blue); }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--gradient-btn);
            color: #fff;
        }

        .btn-refresh {
            background: rgba(6, 182, 212, 0.15);
            color: var(--accent-cyan);
            border: 1px solid rgba(6, 182, 212, 0.3);
            margin-bottom: 20px;
        }

        .btn-refresh:hover {
            background: rgba(6, 182, 212, 0.25);
            color: #fff;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.2);
            margin-top: 15px;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #fff;
        }

        .status-msg {
            font-size: 12px;
            text-align: center;
            margin-bottom: 10px;
        }
        .status-msg.error { color: var(--accent-red); }
        .status-msg.success { color: var(--accent-green); }

        .otp-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
        }

        .otp-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--gradient-primary);
        }

        .otp-email {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .otp-subject {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .otp-code-box {
            display: inline-block;
            font-size: 22px;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 2px;
            background: rgba(56, 189, 248, 0.1);
            padding: 4px 12px;
            border-radius: 8px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            margin-bottom: 6px;
        }

        .otp-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 🔒 LOGIN SECTION -->
        <div id="loginSection" class="login-box">
            <div class="login-title"><i class="fa-solid fa-shield-halved"></i> Master Access</div>
            <div class="login-subtitle">ড্যাশবোর্ড অ্যাক্সেস করতে মাস্টার পাসওয়ার্ড দিন</div>
            <div id="loginMsg" class="status-msg error"></div>
            <div class="input-group">
                <input type="password" id="masterPasswordInput" placeholder="Master Password" autocomplete="off">
            </div>
            <button class="btn btn-primary" onclick="login()">
                <i class="fa-solid fa-key"></i> Unlock Dashboard
            </button>
        </div>

        <!-- 🔓 DASHBOARD SECTION -->
        <div id="dashboardSection" class="hidden">
            <!-- Top Bar -->
            <div class="top-bar">
                <div class="header-title">
                    <i class="fa-solid fa-envelope-open-text"></i> OTP Dashboard
                </div>
                
                <button class="settings-btn" id="settingsToggle" title="Add Account Settings">
                    <i class="fa-solid fa-gear"></i>
                </button>

                <!-- Hidden Add Account Dropdown -->
                <div class="settings-popup" id="settingsPopup">
                    <div class="popup-title">
                        <i class="fa-solid fa-user-plus"></i> Add Gmail Account
                    </div>
                    <div id="addAccMsg" class="status-msg"></div>
                    <div class="input-group">
                        <input type="email" id="newEmail" placeholder="Gmail Address" autocomplete="off">
                    </div>
                    <div class="input-group">
                        <input type="password" id="newAppPass" placeholder="16-digit App Password" autocomplete="off">
                    </div>
                    <button class="btn btn-primary" onclick="addAccount()">
                        <i class="fa-solid fa-floppy-disk"></i> Save Account
                    </button>
                </div>
            </div>

            <!-- Refresh Button -->
            <button class="btn btn-refresh" onclick="fetchOTPs()">
                <i class="fa-solid fa-rotate-right"></i> Refresh OTPs
            </button>

            <!-- OTP List Container -->
            <div id="otpContainer"></div>

            <!-- Logout Button -->
            <button class="btn btn-logout" onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>
    </div>

    <script>
        let MASTER_PASS = "";

        // ১. লগইন লজিক (API Request)
        async function login() {
            const pass = document.getElementById('masterPasswordInput').value;
            const msgBox = document.getElementById('loginMsg');
            msgBox.innerText = "";

            if (!pass) {
                msgBox.innerText = "পাসওয়ার্ড প্রদান করুন!";
                return;
            }

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pass })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    MASTER_PASS = pass;
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('dashboardSection').classList.remove('hidden');
                    fetchOTPs();
                } else {
                    msgBox.innerText = data.error || "ভুল পাসওয়ার্ড!";
                }
            } catch (err) {
                msgBox.innerText = "সার্ভারে কানেক্ট করা যাচ্ছে না!";
            }
        }

        // ২. OTP গুলো ফেচ করার লজিক (API Request)
        async function fetchOTPs() {
            const container = document.getElementById('otpContainer');
            container.innerHTML = '<div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i> ইমেইল চেক করা হচ্ছে...</div>';

            try {
                const res = await fetch('/api/fetch-otps', {
                    headers: { 'X-Master-Password': MASTER_PASS }
                });

                if (!res.ok) throw new Error("Unauthorized");

                const otps = await res.json();
                container.innerHTML = "";

                if (otps.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fa-solid fa-inbox" style="font-size: 24px; margin-bottom: 6px; display: block;"></i>
                            কোনো OTP পাওয়া যায়নি।
                        </div>`;
                    return;
                }

                otps.forEach(item => {
                    container.innerHTML += `
                        <div class="otp-card">
                            <div class="otp-email"><i class="fa-regular fa-envelope"></i> ${item.email}</div>
                            <div class="otp-subject">${item.subject}</div>
                            ${item.code ? `<div class="otp-code-box">OTP: ${item.code}</div>` : ''}
                            <div class="otp-time"><i class="fa-regular fa-clock"></i> Time: ${item.time}</div>
                        </div>`;
                });
            } catch (err) {
                container.innerHTML = '<div class="empty-state" style="color:var(--accent-red);">ডাটা আনতে সমস্যা হয়েছে! আবার চেষ্টা করুন।</div>';
            }
        }

        // ৩. অ্যাকাউন্ট যুক্ত করার লজিক (API Request)
        async function addAccount() {
            const email = document.getElementById('newEmail').value;
            const password = document.getElementById('newAppPass').value;
            const msgBox = document.getElementById('addAccMsg');

            if (!email || !password) {
                msgBox.className = "status-msg error";
                msgBox.innerText = "সবগুলো ঘর পূরণ করুন!";
                return;
            }

            try {
                const res = await fetch('/api/add-account', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Password': MASTER_PASS
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (res.ok) {
                    msgBox.className = "status-msg success";
                    msgBox.innerText = data.message;
                    document.getElementById('newEmail').value = "";
                    document.getElementById('newAppPass').value = "";
                    setTimeout(() => {
                        document.getElementById('settingsPopup').classList.remove('active');
                        fetchOTPs();
                    }, 1200);
                } else {
                    msgBox.className = "status-msg error";
                    msgBox.innerText = data.error;
                }
            } catch (err) {
                msgBox.className = "status-msg error";
                msgBox.innerText = "অ্যাবাউট যোগ করা যায়নি!";
            }
        }

        // ৪. লগআউট লজিক (সরাসরি সেশন রিসেট)
        function logout() {
            MASTER_PASS = "";
            document.getElementById('masterPasswordInput').value = "";
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('loginMsg').innerText = "";
        }

        // Dropdown Popup Toggle
        const settingsToggle = document.getElementById('settingsToggle');
        const settingsPopup = document.getElementById('settingsPopup');

        settingsToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            settingsPopup.classList.toggle('active');
        });

        document.addEventListener('click', (e) => {
            if (!settingsPopup.contains(e.target) && !settingsToggle.contains(e.target)) {
                settingsPopup.classList.remove('active');
            }
        });
    </script>
</body>
</html>
