<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail OTP Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(18, 24, 38, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --gradient-primary: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --gradient-btn: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            --shadow-glow: 0 0 25px rgba(59, 130, 246, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(59, 130, 246, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(139, 92, 246, 0.12) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 32px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), var(--shadow-glow);
        }

        .hidden { display: none !important; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            position: relative;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .settings-btn:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: var(--accent-blue);
            color: var(--accent-cyan);
            transform: rotate(45deg);
        }

        .settings-popup {
            display: none;
            position: absolute;
            top: 50px;
            right: 0;
            width: 320px;
            background: #111827;
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 100;
            animation: fadeIn 0.2s ease-in-out;
        }

        .settings-popup.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes customSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .rotating {
            display: inline-block;
            animation: customSpin 0.8s linear infinite;
        }

        /* সবুজ পালসিং ডট */
        .new-dot {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #10b981;
            z-index: 5;
        }

        .new-dot::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.4);
            animation: dotPulse 1.5s ease-in-out infinite;
        }

        @keyframes dotPulse {
            0%, 100% { transform: scale(0.8); opacity: 0.6; }
            50% { transform: scale(1.6); opacity: 0; }
        }

        .popup-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-cyan);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
        }

        .input-group { margin-bottom: 12px; }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus { border-color: var(--accent-blue); }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--gradient-btn);
            color: #fff;
        }

        .btn-refresh {
            background: rgba(6, 182, 212, 0.15);
            color: var(--accent-cyan);
            border: 1px solid rgba(6, 182, 212, 0.3);
            margin-bottom: 20px;
        }

        .btn-refresh:hover {
            background: rgba(6, 182, 212, 0.25);
            color: #fff;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.2);
            margin-top: 15px;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #fff;
        }

        .msg-status {
            font-size: 12px;
            text-align: center;
            margin-bottom: 12px;
            display: none;
        }

        .otp-container {
            max-height: 420px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .otp-container::-webkit-scrollbar { width: 5px; }
        .otp-container::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }

        .otp-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
        }

        .otp-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--gradient-primary);
        }

        /* নতুন কার্ডে সবুজ বর্ডার গ্লো */
        .otp-card.is-new {
            border-color: rgba(16, 185, 129, 0.4);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.1);
        }

        .otp-email { 
            font-size: 13px; 
            font-weight: 600; 
            color: var(--accent-cyan); 
            margin-bottom: 6px; 
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .otp-subject { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }

        .otp-code-box {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 3px;
            background: rgba(56, 189, 248, 0.1);
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .otp-code-box:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
            transform: translateY(-1px);
        }

        .otp-code-box:active { transform: scale(0.96); }

        .otp-time { font-size: 11px; color: var(--text-muted); }
        .empty-state { text-align: center; color: var(--text-muted); font-size: 13px; padding: 20px 0; }

        .toast {
            visibility: hidden;
            min-width: 160px;
            background: rgba(16, 185, 129, 0.95);
            color: #fff;
            text-align: center;
            border-radius: 30px;
            padding: 10px 20px;
            position: fixed;
            z-index: 1000;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(8px);
        }

        .toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 35px;
        }
        /* ---- swipe to delete ---- */
        .otp-swipe {
            position: relative;
            overflow: hidden;
            border-radius: 14px;
            margin-bottom: 12px;
        }
        .otp-swipe .otp-card {
            margin-bottom: 0;
            transition: transform 0.2s ease;
            touch-action: pan-y;
            user-select: none;
            -webkit-user-select: none;
        }
        .swipe-delete {
            position: absolute;
            top: 0; left: 0; bottom: 0;
            width: 76px;
            border: none;
            background: rgba(239, 68, 68, 0.92);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.15s ease;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 500;
            padding: 20px;
        }
        .modal-box {
            width: 100%;
            max-width: 340px;
            background: #111827;
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }
        .btn-danger { background: linear-gradient(135deg, #dc2626, #ef4444); color: #fff; }
        .btn-cancel { background: rgba(255,255,255,0.06); color: var(--text-muted); margin-top: 8px; }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- LOGIN SECTION -->
        <div id="loginSection">
            <div class="header-title" style="justify-content: center; margin-bottom: 20px;">
                <i class="fa-solid fa-lock"></i> Secure Login
            </div>
            <div id="loginError" class="msg-status" style="color: var(--accent-red);"></div>
            <form id="loginForm">
                <div class="input-group">
                    <input type="password" id="masterPasswordInput" placeholder="Enter Master Password" required autocomplete="off">
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-right-to-bracket"></i> Login
                </button>
                <button type="button" class="btn btn-primary hidden" id="passkeyLoginBtn" style="margin-top: 10px;">
                    <i class="fa-solid fa-fingerprint"></i> Login with Fingerprint / Face
                </button>
            </form>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="dashboardSection" class="hidden">
            <div class="top-bar">
                <div class="header-title">
                    <i class="fa-solid fa-envelope-open-text"></i> OTP Dashboard
                </div>
                
                <button class="settings-btn" id="settingsToggle" title="Add Account Settings">
                    <i class="fa-solid fa-gear"></i>
                </button>

                <div class="settings-popup" id="settingsPopup">
                    <div class="settings-auth" id="settingsAuth">
                        <div class="popup-title">
                            <i class="fa-solid fa-lock"></i> Enter Settings Password
                        </div>
                        <form id="settingsAuthForm">
                            <div class="input-group">
                                <input type="password" id="settingsPasswordInput" placeholder="Enter password" required autocomplete="off">
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="fa-solid fa-key"></i> Unlock
                            </button>
                            <button type="button" class="btn btn-primary hidden" id="passkeySettingsBtn" style="margin-top: 8px;">
                                <i class="fa-solid fa-fingerprint"></i> Unlock with Fingerprint / Face
                            </button>
                        </form>
                        <div id="settingsAuthError" class="msg-status" style="color: var(--accent-red); display: none; margin-top: 8px; font-size: 13px;"></div>
                    </div>

                    <div class="settings-content hidden" id="settingsContent">
                        <div class="popup-title">
                            <i class="fa-solid fa-user-plus"></i> Add Gmail Account
                        </div>
                        <button type="button" class="btn btn-primary hidden" id="registerPasskeyBtn" style="margin-bottom: 12px;">
                            <i class="fa-solid fa-fingerprint"></i> Enable Fingerprint / Face on this device
                        </button>
                        <form id="addAccountForm">
                            <div class="input-group">
                                <input type="email" id="accEmail" placeholder="Gmail Address" required autocomplete="off">
                            </div>
                            <div class="input-group">
                                <input type="password" id="accPassword" placeholder="16-digit App Password" required autocomplete="off">
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="fa-solid fa-floppy-disk"></i> Save Account
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div id="accountCountBar" style="display:flex; align-items:center; justify-content:center; gap:8px; margin: 0 0 14px; padding: 8px 12px; border-radius: 10px; background: rgba(34,211,238,0.08); border: 1px solid rgba(34,211,238,0.25); color: #67e8f9; font-size: 14px; font-weight: 600;">
                <i class="fa-solid fa-envelope"></i>
                <span>Total Gmail Added: <span id="accountCount">0</span></span>
            </div>
            <div id="statusMsg" class="msg-status"></div>

            <button type="button" class="btn btn-refresh" id="refreshBtn">
                <i class="fa-solid fa-rotate-right" id="refreshIcon"></i> Refresh OTPs
            </button>
            <div id="autoStatus" style="text-align:center; font-size:12px; opacity:0.65; margin-top:8px;">
                <i class="fa-solid fa-bolt"></i> Auto-refresh ON
            </div>

            <div class="otp-container" id="otpContainer">
                <div class="empty-state">
                    <i class="fa-solid fa-inbox" style="font-size: 24px; margin-bottom: 6px; display: block;"></i>
                    Click "Refresh OTPs" to load emails.
                </div>
            </div>

            <button type="button" class="btn btn-logout" onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>

    </div>

    <!-- Toast Notification -->
    <div id="deleteModal" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="popup-title" style="color: var(--accent-red);">
                <i class="fa-solid fa-trash"></i> Remove Gmail
            </div>
            <div id="deleteTarget" style="font-size: 13px; margin-bottom: 14px; word-break: break-all; color: var(--text-main);"></div>
            <form id="deleteForm">
                <div class="input-group">
                    <input type="password" id="deletePasswordInput" placeholder="Enter settings password" required autocomplete="off">
                </div>
                <button type="submit" class="btn btn-danger">
                    <i class="fa-solid fa-trash"></i> Remove with Password
                </button>
            </form>
            <button type="button" class="btn btn-primary hidden" id="deletePasskeyBtn" style="margin-top: 8px;">
                <i class="fa-solid fa-fingerprint"></i> Remove with Fingerprint / Face
            </button>
            <div id="deleteError" class="msg-status" style="color: var(--accent-red); margin: 8px 0 0; font-size: 13px;"></div>
            <button type="button" class="btn btn-cancel" id="deleteCancelBtn">Cancel</button>
        </div>
    </div>

    <div id="toast" class="toast">
        <i class="fa-solid fa-circle-check"></i> <span id="toastMsg">Copied!</span>
    </div>

    <script>
        const loginSection = document.getElementById('loginSection');
        const dashboardSection = document.getElementById('dashboardSection');
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');

        const settingsToggle = document.getElementById('settingsToggle');
        const settingsPopup = document.getElementById('settingsPopup');
        const otpContainer = document.getElementById('otpContainer');
        const refreshBtn = document.getElementById('refreshBtn');
        const addAccountForm = document.getElementById('addAccountForm');
        const statusMsg = document.getElementById('statusMsg');

        const settingsAuth = document.getElementById('settingsAuth');
        const settingsContent = document.getElementById('settingsContent');
        const settingsAuthForm = document.getElementById('settingsAuthForm');
        const settingsPasswordInput = document.getElementById('settingsPasswordInput');
        const settingsAuthError = document.getElementById('settingsAuthError');

        // আগের কোডগুলো মনে রাখার জন্য
        let previousCodes = [];

        function resetSettingsPopup() {
            settingsAuth.classList.remove('hidden');
            settingsContent.classList.add('hidden');
            settingsPasswordInput.value = '';
            settingsAuthError.style.display = 'none';
            settingsAuthError.innerText = '';
        }

        settingsToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            settingsPopup.classList.toggle('active');
            if (!settingsPopup.classList.contains('active')) {
                resetSettingsPopup();
            }
        });

        function openSettingsContent() {
            settingsAuth.classList.add('hidden');
            settingsContent.classList.remove('hidden');
            settingsAuthError.style.display = 'none';
        }

        function showSettingsError(msg) {
            settingsAuthError.innerText = msg;
            settingsAuthError.style.display = 'block';
        }

        settingsAuthForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = settingsPasswordInput.value.trim();
            try {
                const res = await fetch('/api/settings-unlock', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                if (res.ok) {
                    openSettingsContent();
                } else {
                    showSettingsError('Incorrect password. Please try again.');
                }
            } catch (err) {
                showSettingsError('Server Error!');
            }
        });

        document.addEventListener('click', (e) => {
            if (!settingsPopup.contains(e.target) && !settingsToggle.contains(e.target)) {
                settingsPopup.classList.remove('active');
                resetSettingsPopup();
            }
        });

        function showMessage(msg, isError = false) {
            statusMsg.style.display = 'block';
            statusMsg.style.color = isError ? 'var(--accent-red)' : 'var(--accent-green)';
            statusMsg.innerText = msg;
            setTimeout(() => {
                statusMsg.style.display = 'none';
            }, 4000);
        }

        function copyOTP(code) {
            if (!code || code === 'Code not found' || code === 'No emails found') return;
            navigator.clipboard.writeText(code).then(() => {
                showToast(`Copied: ${code}`);
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.innerText = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2000);
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('masterPasswordInput').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                if (res.ok) {
                    loginSection.classList.add('hidden');
                    dashboardSection.classList.remove('hidden');
                    fetchOTPs();
                } else {
                    loginError.style.display = 'block';
                    loginError.innerText = "Wrong Master Password!";
                }
            } catch (err) {
                loginError.style.display = 'block';
                loginError.innerText = "Server Error!";
            }
        });

        async function loadAccountCount() {
            try {
                const res = await fetch('/api/accounts-count');
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('accountCount').innerText = data.count;
                }
            } catch (err) {}
        }

        let isFetching = false;

        async function fetchOTPs(silent = false) {
            if (isFetching) return;
            isFetching = true;

            if (!silent) {
                loadAccountCount();
                refreshBtn.disabled = true;
                refreshBtn.style.opacity = '0.75';
                refreshBtn.style.cursor = 'not-allowed';
                refreshBtn.innerHTML = `<i class="fa-solid fa-rotate-right rotating"></i> Checking Gmail...`;

                otpContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-spinner rotating" style="font-size: 24px; margin-bottom: 6px; display: block;"></i>
                        Fetching OTPs from servers...
                    </div>`;
            }

            try {
                const res = await fetch('/api/fetch-otps');

                if (res.status === 401) {
                    dashboardSection.classList.add('hidden');
                    loginSection.classList.remove('hidden');
                    return;
                }

                if (!res.ok) throw new Error("Failed");

                const data = await res.json();
                renderOTPs(data);
                const t = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                document.getElementById('autoStatus').innerHTML =
                    `<i class="fa-solid fa-bolt"></i> Auto-refresh ON &middot; Last updated ${t}`;

            } catch (err) {
                // silent refresh e error hole purono OTP gulo thakbe, kichu muche jabe na
                if (!silent) {
                    otpContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fa-solid fa-triangle-exclamation" style="font-size: 24px; color: var(--accent-red); margin-bottom: 6px; display: block;"></i>
                            Error loading OTPs. Try again.
                        </div>`;
                }
            } finally {
                isFetching = false;
                if (!silent) {
                    refreshBtn.disabled = false;
                    refreshBtn.style.opacity = '1';
                    refreshBtn.style.cursor = 'pointer';
                    refreshBtn.innerHTML = `<i class="fa-solid fa-rotate-right"></i> Refresh OTPs`;
                }
            }
        }

        function escAttr(s) {
            return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function renderOTPs(otps) {
            if (!otps || otps.length === 0) {
                otpContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-inbox" style="font-size: 24px; margin-bottom: 6px; display: block;"></i>
                        No Gmail accounts added yet.
                    </div>`;
                return;
            }

            // কোন কোন কার্ড নতুন তা চেক করা
            let newCardEmails = [];
            if (previousCodes.length > 0) {
                otps.forEach(item => {
                    if (item.code && item.code !== 'Code not found' && item.code !== 'No emails found' && item.code !== 'Error') {
                        const prev = previousCodes.find(p => p.email === item.email);
                        // আগে ছিল না বা কোড পরিবর্তন হয়েছে = নতুন
                        if (!prev || prev.code !== item.code) {
                            newCardEmails.push(item.email);
                        }
                    }
                });
            } else {
                // প্রথমবার লোড হলে প্রথমটা নতুন হিসেবে দেখাবে
                if (otps[0] && otps[0].code && otps[0].code !== 'Code not found' && otps[0].code !== 'No emails found' && otps[0].code !== 'Error') {
                    newCardEmails.push(otps[0].email);
                }
            }

            // কারেন্ট কোডগুলো সেভ করে রাখা
            previousCodes = otps.map(item => ({ email: item.email, code: item.code }));

            otpContainer.innerHTML = otps.map(item => {
                const isNew = newCardEmails.includes(item.email);
                const validCode = item.code && item.code !== 'Code not found' && item.code !== 'No emails found' && item.code !== 'Error';

                return `
                <div class="otp-swipe">
                <button type="button" class="swipe-delete" data-email="${escAttr(item.email)}" title="Remove this Gmail"><i class="fa-solid fa-trash"></i></button>
                <div class="otp-card ${isNew ? 'is-new' : ''}">
                    ${isNew ? '<div class="new-dot"></div>' : ''}
                    <div class="otp-email">
                        ${item.email}
                    </div>
                    ${validCode ? `
                        <div class="otp-code-box" onclick="copyOTP('${item.code}')" title="Click to copy">
                            ${item.code}
                        </div>
                    ` : `
                        <div class="otp-code-box" style="cursor: default; opacity: 0.6; font-size: 14px; letter-spacing: normal;">
                            ${item.code || 'Code not found'}
                        </div>
                    `}
                    <div class="otp-time">
                        <i class="fa-regular fa-clock"></i> Time: ${item.time || 'N/A'} | Sender: ${item.sender || 'N/A'}
                    </div>
                </div>
                </div>`;
            }).join('');
        }

        addAccountForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('accEmail').value;
            const password = document.getElementById('accPassword').value;

            try {
                const res = await fetch('/api/add-account', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const result = await res.json();

                if (res.ok) {
                    showMessage(result.message || "Account added!");
                    addAccountForm.reset();
                    settingsPopup.classList.remove('active');
                    fetchOTPs();
                } else {
                    showMessage(result.error || "Failed", true);
                }
            } catch (err) {
                showMessage("Connection error", true);
            }
        });

        refreshBtn.addEventListener('click', () => fetchOTPs());

        // ---------- Fingerprint / Face (Passkey) ----------
        const passkeyLoginBtn = document.getElementById('passkeyLoginBtn');
        const passkeySettingsBtn = document.getElementById('passkeySettingsBtn');
        const registerPasskeyBtn = document.getElementById('registerPasskeyBtn');

        if (window.PublicKeyCredential) {
            [passkeyLoginBtn, passkeySettingsBtn, registerPasskeyBtn].forEach(b => b.classList.remove('hidden'));
        }

        function b64uToBuf(s) {
            s = s.replace(/-/g, '+').replace(/_/g, '/');
            s += '='.repeat((4 - (s.length % 4)) % 4);
            return Uint8Array.from(atob(s), c => c.charCodeAt(0)).buffer;
        }
        function bufToB64u(buf) {
            let bin = '';
            new Uint8Array(buf).forEach(b => bin += String.fromCharCode(b));
            return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        async function passkeyRegister() {
            const optRes = await fetch('/api/passkey/register/options', { method: 'POST' });
            const opts = await optRes.json();
            if (!optRes.ok) throw new Error(opts.error || 'Failed');
            opts.challenge = b64uToBuf(opts.challenge);
            opts.user.id = b64uToBuf(opts.user.id);
            (opts.excludeCredentials || []).forEach(c => c.id = b64uToBuf(c.id));

            const cred = await navigator.credentials.create({ publicKey: opts });
            const payload = {
                id: cred.id,
                rawId: bufToB64u(cred.rawId),
                type: cred.type,
                response: {
                    clientDataJSON: bufToB64u(cred.response.clientDataJSON),
                    attestationObject: bufToB64u(cred.response.attestationObject),
                    transports: cred.response.getTransports ? cred.response.getTransports() : []
                },
                clientExtensionResults: cred.getClientExtensionResults ? cred.getClientExtensionResults() : {}
            };
            const res = await fetch('/api/passkey/register/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Failed');
        }

        async function passkeyAuth(purpose) {
            const optRes = await fetch('/api/passkey/auth/options', { method: 'POST' });
            const opts = await optRes.json();
            if (!optRes.ok) throw new Error(opts.error || 'Failed');
            opts.challenge = b64uToBuf(opts.challenge);
            (opts.allowCredentials || []).forEach(c => c.id = b64uToBuf(c.id));

            const cred = await navigator.credentials.get({ publicKey: opts });
            const credential = {
                id: cred.id,
                rawId: bufToB64u(cred.rawId),
                type: cred.type,
                response: {
                    clientDataJSON: bufToB64u(cred.response.clientDataJSON),
                    authenticatorData: bufToB64u(cred.response.authenticatorData),
                    signature: bufToB64u(cred.response.signature),
                    userHandle: cred.response.userHandle ? bufToB64u(cred.response.userHandle) : null
                },
                clientExtensionResults: cred.getClientExtensionResults ? cred.getClientExtensionResults() : {}
            };
            const res = await fetch('/api/passkey/auth/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ purpose, credential })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Failed');
        }

        passkeyLoginBtn.addEventListener('click', async () => {
            try {
                await passkeyAuth('login');
                loginError.style.display = 'none';
                loginSection.classList.add('hidden');
                dashboardSection.classList.remove('hidden');
                fetchOTPs();
            } catch (err) {
                loginError.style.display = 'block';
                loginError.innerText = err.message || 'Fingerprint login failed';
            }
        });

        passkeySettingsBtn.addEventListener('click', async () => {
            try {
                await passkeyAuth('settings');
                openSettingsContent();
            } catch (err) {
                showSettingsError(err.message || 'Fingerprint unlock failed');
            }
        });

        registerPasskeyBtn.addEventListener('click', async () => {
            try {
                await passkeyRegister();
                showToast('Fingerprint / Face enabled!');
            } catch (err) {
                showToast(err.message || 'Could not enable');
            }
        });

        // ---------- Swipe to delete ----------
        const OPEN_W = 76;
        let swipe = null;
        let openWrap = null;

        function setSwipe(wrap, open) {
            const card = wrap.querySelector('.otp-card');
            const btn = wrap.querySelector('.swipe-delete');
            card.style.transform = open ? `translateX(${OPEN_W}px)` : '';
            btn.style.opacity = open ? '1' : '0';
            wrap.classList.toggle('open', open);
            openWrap = open ? wrap : (openWrap === wrap ? null : openWrap);
        }

        otpContainer.addEventListener('pointerdown', (e) => {
            const card = e.target.closest('.otp-card');
            if (!card) return;
            const wrap = card.parentElement;
            if (openWrap && openWrap !== wrap) setSwipe(openWrap, false);
            swipe = {
                wrap, card, id: e.pointerId,
                startX: e.clientX, startY: e.clientY,
                base: wrap.classList.contains('open') ? OPEN_W : 0,
                horizontal: null, x: 0
            };
        });

        otpContainer.addEventListener('pointermove', (e) => {
            if (!swipe || e.pointerId !== swipe.id) return;
            const dx = e.clientX - swipe.startX;
            const dy = e.clientY - swipe.startY;
            if (swipe.horizontal === null) {
                if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
                swipe.horizontal = Math.abs(dx) > Math.abs(dy);
                if (swipe.horizontal) {
                    try { swipe.card.setPointerCapture(e.pointerId); } catch (err) {}
                    swipe.card.style.transition = 'none';
                }
            }
            if (!swipe.horizontal) return;
            swipe.x = Math.max(0, Math.min(OPEN_W + 20, swipe.base + dx));
            swipe.card.style.transform = `translateX(${swipe.x}px)`;
            swipe.wrap.querySelector('.swipe-delete').style.opacity = Math.min(swipe.x / 50, 1);
        });

        function endSwipe() {
            if (!swipe) return;
            const s = swipe;
            swipe = null;
            if (!s.horizontal) return;
            s.card.style.transition = '';
            setSwipe(s.wrap, s.x > OPEN_W / 2);
            s.wrap.dataset.dragged = '1';
            setTimeout(() => { delete s.wrap.dataset.dragged; }, 80);
        }
        otpContainer.addEventListener('pointerup', endSwipe);
        otpContainer.addEventListener('pointercancel', endSwipe);

        // drag-er por ba khola obosthay click holey OTP copy hobe na
        otpContainer.addEventListener('click', (e) => {
            const wrap = e.target.closest('.otp-swipe');
            if (!wrap) return;
            if (wrap.dataset.dragged === '1') { e.stopPropagation(); e.preventDefault(); return; }
            const delBtn = e.target.closest('.swipe-delete');
            if (delBtn) {
                openDeleteModal(delBtn.dataset.email);
                return;
            }
            if (wrap.classList.contains('open')) {
                e.stopPropagation(); e.preventDefault();
                setSwipe(wrap, false);
            }
        }, true);

        document.addEventListener('click', (e) => {
            if (openWrap && !openWrap.contains(e.target)) setSwipe(openWrap, false);
        });

        // ---------- Delete Gmail (password / fingerprint) ----------
        const deleteModal = document.getElementById('deleteModal');
        const deleteTarget = document.getElementById('deleteTarget');
        const deleteForm = document.getElementById('deleteForm');
        const deletePasswordInput = document.getElementById('deletePasswordInput');
        const deletePasskeyBtn = document.getElementById('deletePasskeyBtn');
        const deleteError = document.getElementById('deleteError');
        let deleteTargetEmail = null;

        if (window.PublicKeyCredential) deletePasskeyBtn.classList.remove('hidden');

        function deleteModalOpen() { return !deleteModal.classList.contains('hidden'); }

        function openDeleteModal(email) {
            deleteTargetEmail = email;
            deleteTarget.innerText = email;
            deletePasswordInput.value = '';
            deleteError.style.display = 'none';
            deleteModal.classList.remove('hidden');
            setTimeout(() => deletePasswordInput.focus(), 50);
        }

        function closeDeleteModal() {
            deleteModal.classList.add('hidden');
            deleteTargetEmail = null;
            deletePasswordInput.value = '';
            if (openWrap) setSwipe(openWrap, false);
        }

        function showDeleteError(msg) {
            deleteError.innerText = msg;
            deleteError.style.display = 'block';
        }

        function removeCardFromScreen(email) {
            const wrap = [...otpContainer.querySelectorAll('.otp-swipe')]
                .find(w => w.querySelector('.swipe-delete').dataset.email === email);
            previousCodes = previousCodes.filter(p => p.email !== email);
            if (openWrap === wrap) openWrap = null;
            if (wrap) {
                wrap.style.transition = 'opacity 0.25s ease';
                wrap.style.opacity = '0';
                setTimeout(() => {
                    wrap.remove();
                    if (!otpContainer.querySelector('.otp-swipe')) {
                        otpContainer.innerHTML = `
                            <div class="empty-state">
                                <i class="fa-solid fa-inbox" style="font-size: 24px; margin-bottom: 6px; display: block;"></i>
                                No Gmail accounts added yet.
                            </div>`;
                    }
                }, 260);
            }
            loadAccountCount();
        }

        async function deleteAccountRequest(email, extra) {
            const res = await fetch('/api/delete-account', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, ...extra })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Failed');
        }

        deleteForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = deleteTargetEmail;
            try {
                await deleteAccountRequest(email, { password: deletePasswordInput.value });
                closeDeleteModal();
                removeCardFromScreen(email);
                showToast('Gmail removed');
            } catch (err) {
                showDeleteError(err.message || 'Failed');
            }
        });

        deletePasskeyBtn.addEventListener('click', async () => {
            const email = deleteTargetEmail;
            try {
                await passkeyAuth('delete');
                await deleteAccountRequest(email, { use_passkey: true });
                closeDeleteModal();
                removeCardFromScreen(email);
                showToast('Gmail removed');
            } catch (err) {
                showDeleteError(err.message || 'Fingerprint verification failed');
            }
        });

        document.getElementById('deleteCancelBtn').addEventListener('click', closeDeleteModal);
        deleteModal.addEventListener('click', (e) => { if (e.target === deleteModal) closeDeleteModal(); });

        // ---------- Auto refresh ----------
        const AUTO_REFRESH_SECONDS = 30;   // koto sekende ekbar check hobe
        const AUTO_IDLE_MINUTES = 5;       // koto minute kichu na korle auto-refresh thambe
        let lastActivity = Date.now();
        let autoPaused = false;

        function dashboardIsOpen() {
            return !dashboardSection.classList.contains('hidden');
        }

        function setAutoStatus(html) {
            document.getElementById('autoStatus').innerHTML = html;
        }

        function autoRefreshAllowed() {
            return dashboardIsOpen() && document.visibilityState === 'visible'
                && !deleteModalOpen() && !openWrap && !autoPaused;
        }

        // Shudhu click / tap / key / scroll ke "kaj kora" dhora hoy.
        // Mouse bhul kore nare gele bondho hoye thaka auto-refresh abar chalu hobe na.
        function markActivity() {
            if (autoPaused) return;
            lastActivity = Date.now();
        }
        ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(ev =>
            document.addEventListener(ev, markActivity, { passive: true }));

        function resumeAutoRefresh() {
            autoPaused = false;
            lastActivity = Date.now();
            setAutoStatus('<i class="fa-solid fa-bolt"></i> Auto-refresh ON');
            fetchOTPs(true);
        }

        setInterval(() => {
            if (!dashboardIsOpen()) {
                // logout / session shesh hole abar notun kore shuru
                autoPaused = false;
                lastActivity = Date.now();
                return;
            }
            if (document.visibilityState !== 'visible') return;
            if (!autoPaused && Date.now() - lastActivity > AUTO_IDLE_MINUTES * 60 * 1000) {
                autoPaused = true;
                setAutoStatus('<i class="fa-solid fa-pause"></i> Auto-refresh paused &middot; ' +
                    '<button type="button" onclick="resumeAutoRefresh()" ' +
                    'style="background:none;border:none;color:#22d3ee;font-weight:700;font-size:12px;cursor:pointer;text-decoration:underline;">Resume</button>');
                return;
            }
            if (autoRefreshAllowed()) fetchOTPs(true);
        }, AUTO_REFRESH_SECONDS * 1000);

        // tab-e fire asle sathe sathe ekbar update
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && autoRefreshAllowed()) {
                fetchOTPs(true);
            }
        });

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            dashboardSection.classList.add('hidden');
            loginSection.classList.remove('hidden');
            document.getElementById('masterPasswordInput').value = '';
            previousCodes = [];
            autoPaused = false;
            lastActivity = Date.now();
        }
    </script>
</body>
</html>
