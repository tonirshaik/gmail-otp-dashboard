<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail OTP Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
        }
        
        /* Login Page */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        .login-box {
            background: rgba(255,255,255,0.05);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            width: 350px;
        }
        .login-box h2 { text-align: center; margin-bottom: 30px; }
        .login-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: #00d4ff;
            border: none;
            border-radius: 10px;
            color: #000;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .login-box button:hover { background: #00b8d9; }
        
        /* Dashboard */
        .dashboard { display: none; padding: 20px; }
        
        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            margin-bottom: 20px;
        }
        .top-bar h1 { font-size: 22px; }
        .logout-btn {
            padding: 8px 20px;
            background: #ff4757;
            border: none;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
        }
        
        /* Stats Cards */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: linear-gradient(135deg, rgba(0,212,255,0.1), rgba(0,212,255,0.05));
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }
        .stat-card .number {
            font-size: 42px;
            font-weight: 700;
            color: #00d4ff;
        }
        .stat-card .label {
            font-size: 14px;
            color: #888;
            margin-top: 5px;
        }
        .stat-card.green { border-color: rgba(0,255,136,0.3); }
        .stat-card.green .number { color: #00ff88; }
        .stat-card.purple { border-color: rgba(168,85,247,0.3); }
        .stat-card.purple .number { color: #a855f7; }
        
        /* Account List */
        .section-title {
            font-size: 18px;
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 3px solid #00d4ff;
        }
        .accounts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }
        .account-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .account-card .email {
            font-size: 14px;
            color: #ccc;
        }
        .account-card .date {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
        .delete-btn {
            padding: 6px 12px;
            background: rgba(255,71,87,0.2);
            border: 1px solid rgba(255,71,87,0.3);
            border-radius: 6px;
            color: #ff4757;
            cursor: pointer;
            font-size: 12px;
        }
        .delete-btn:hover { background: rgba(255,71,87,0.4); }
        
        /* Add Account Form */
        .add-form {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .add-form h3 { margin-bottom: 15px; }
        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .form-row input {
            flex: 1;
            min-width: 200px;
            padding: 10px 15px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }
        .form-row button {
            padding: 10px 25px;
            background: #00d4ff;
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: 600;
            cursor: pointer;
        }
        
        /* OTP Results */
        .otp-container {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 15px;
            padding: 20px;
        }
        .otp-item {
            background: rgba(0,212,255,0.05);
            border: 1px solid rgba(0,212,255,0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .otp-code {
            font-size: 24px;
            font-weight: 700;
            color: #00ff88;
            font-family: monospace;
        }
        .otp-email { font-size: 13px; color: #888; }
        .otp-time { font-size: 12px; color: #666; }
        .no-otp { color: #666; font-style: italic; }
        
        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .msg {
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }
        .msg.success { background: rgba(0,255,136,0.1); color: #00ff88; border: 1px solid rgba(0,255,136,0.2); display: block; }
        .msg.error { background: rgba(255,71,87,0.1); color: #ff4757; border: 1px solid rgba(255,71,87,0.2); display: block; }
    </style>
</head>
<body>

<!-- Login Page -->
<div class="login-container" id="loginPage">
    <div class="login-box">
        <h2>🔐 Login</h2>
        <input type="password" id="loginPass" placeholder="Enter Master Password">
        <button onclick="login()">Login</button>
        <p id="loginError" style="color: #ff4757; text-align: center; margin-top: 15px; display: none;">Wrong Password!</p>
    </div>
</div>

<!-- Dashboard -->
<div class="dashboard" id="dashboard">
    <div class="top-bar">
        <h1>📬 Gmail OTP Dashboard</h1>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
    
    <!-- Stats Cards -->
    <div class="stats-row">
        <div class="stat-card">
            <div class="number" id="totalAccounts">0</div>
            <div class="label">Total Gmail Accounts</div>
        </div>
        <div class="stat-card green">
            <div class="number" id="activeOTPs">0</div>
            <div class="label">Active OTPs Found</div>
        </div>
        <div class="stat-card purple">
            <div class="number" id="lastFetch">--:--</div>
            <div class="label">Last Fetch Time</div>
        </div>
    </div>
    
    <!-- Add Account Form -->
    <div class="add-form">
        <h3>➕ Add New Gmail Account</h3>
        <div id="addMsg" class="msg"></div>
        <div class="form-row">
            <input type="email" id="newEmail" placeholder="Gmail Address">
            <input type="password" id="newPassword" placeholder="App Password">
            <button onclick="addAccount()">Add Account</button>
        </div>
    </div>
    
    <!-- Account List -->
    <h3 class="section-title">📋 Added Accounts</h3>
    <div class="accounts-grid" id="accountsList">
        <div class="loading"><div class="spinner"></div>Loading accounts...</div>
    </div>
    
    <!-- Fetch OTP Button -->
    <div style="margin-bottom: 20px;">
        <button onclick="fetchOTPs()" style="padding: 12px 30px; background: #00ff88; border: none; border-radius: 10px; color: #000; font-size: 16px; font-weight: 600; cursor: pointer;">
            🔄 Fetch All OTPs
        </button>
    </div>
    
    <!-- OTP Results -->
    <h3 class="section-title">🔑 OTP Results</h3>
    <div class="otp-container" id="otpResults">
        <div class="no-otp">Click "Fetch All OTPs" to get latest codes</div>
    </div>
</div>

<script>
    // Login Function
    async function login() {
        const pass = document.getElementById('loginPass').value;
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pass })
        });
        
        if (res.ok) {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loadAccountStats();
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    }
    
    // Logout Function
    async function logout() {
        await fetch('/api/logout', { method: 'POST' });
        document.getElementById('loginPage').style.display = 'flex';
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('loginPass').value = '';
        document.getElementById('loginError').style.display = 'none';
    }
    
    // Load Account Stats & List
    async function loadAccountStats() {
        try {
            const res = await fetch('/api/accounts-list');
            const data = await res.json();
            
            // Update Stats
            document.getElementById('totalAccounts').textContent = data.total;
            
            // Update Account List
            const listDiv = document.getElementById('accountsList');
            
            if (data.total === 0) {
                listDiv.innerHTML = '<div class="no-otp" style="grid-column: 1/-1; text-align: center; padding: 30px;">No accounts added yet</div>';
            } else {
                listDiv.innerHTML = data.accounts.map(acc => `
                    <div class="account-card">
                        <div>
                            <div class="email">📧 ${acc.email}</div>
                            <div class="date">Added: ${acc.created_at}</div>
                        </div>
                        <button class="delete-btn" onclick="deleteAccount('${acc.email}')">🗑️ Delete</button>
                    </div>
                `).join('');
            }
        } catch (e) {
            console.error(e);
        }
    }
    
    // Add Account
    async function addAccount() {
        const email = document.getElementById('newEmail').value;
        const password = document.getElementById('newPassword').value;
        const msgDiv = document.getElementById('addMsg');
        
        msgDiv.className = 'msg';
        msgDiv.style.display = 'none';
        
        if (!email || !password) {
            msgDiv.textContent = 'Please enter both email and password!';
            msgDiv.className = 'msg error';
            return;
        }
        
        try {
            const res = await fetch('/api/add-account', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            
            if (res.ok) {
                msgDiv.textContent = data.message;
                msgDiv.className = 'msg success';
                document.getElementById('newEmail').value = '';
                document.getElementById('newPassword').value = '';
                loadAccountStats(); // Refresh list
            } else {
                msgDiv.textContent = data.error;
                msgDiv.className = 'msg error';
            }
        } catch (e) {
            msgDiv.textContent = 'Failed to add account!';
            msgDiv.className = 'msg error';
        }
    }
    
    // Delete Account
    async function deleteAccount(email) {
        if (!confirm(`Delete ${email}?`)) return;
        
        try {
            const res = await fetch('/api/delete-account', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            
            if (res.ok) {
                loadAccountStats();
            } else {
                alert('Failed to delete!');
            }
        } catch (e) {
            alert('Error!');
        }
    }
    
    // Fetch OTPs
    async function fetchOTPs() {
        const otpDiv = document.getElementById('otpResults');
        otpDiv.innerHTML = '<div class="loading"><div class="spinner"></div>Fetching OTPs from all accounts...</div>';
        
        try {
            const res = await fetch('/api/fetch-otps');
            const data = await res.json();
            
            // Update last fetch time
            const now = new Date();
            document.getElementById('lastFetch').textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            
            // Count active OTPs
            const activeCount = data.filter(d => d.code !== 'No emails found' && d.code !== 'Error').length;
            document.getElementById('activeOTPs').textContent = activeCount;
            
            if (data.length === 0) {
                otpDiv.innerHTML = '<div class="no-otp">No accounts configured</div>';
                return;
            }
            
            otpDiv.innerHTML = data.map(item => {
                const isActive = item.code !== 'No emails found' && item.code !== 'Error';
                return `
                    <div class="otp-item" style="border-color: ${isActive ? 'rgba(0,255,136,0.2)' : 'rgba(255,255,255,0.05)'}">
                        <div>
                            <div class="otp-code" style="color: ${isActive ? '#00ff88' : '#666'}">${item.code}</div>
                            <div class="otp-email">📧 ${item.email}</div>
                            ${item.sender !== 'N/A' ? `<div class="otp-time">From: ${item.sender.substring(0, 40)}</div>` : ''}
                        </div>
                        <div style="text-align: right;">
                            <div class="otp-time">${item.time}</div>
                            <div style="font-size: 11px; color: #555; margin-top: 4px;">${item.subject.substring(0, 30)}...</div>
                        </div>
                    </div>
                `;
            }).join('');
            
        } catch (e) {
            otpDiv.innerHTML = '<div class="no-otp" style="color: #ff4757;">Error fetching OTPs!</div>';
        }
    }
    
    // Enter key for login
    document.getElementById('loginPass').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') login();
    });
</script>

</body>
</html>
