<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail OTP Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(18, 24, 38, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --gradient-primary: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --gradient-btn: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            --shadow-glow: 0 0 25px rgba(59, 130, 246, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(59, 130, 246, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(139, 92, 246, 0.12) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 32px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), var(--shadow-glow);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            position: relative;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .settings-btn:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: var(--accent-blue);
            color: var(--accent-cyan);
            transform: rotate(45deg);
        }

        .settings-popup {
            display: none;
            position: absolute;
            top: 50px;
            right: 0;
            width: 320px;
            background: #111827;
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 100;
            animation: fadeIn 0.2s ease-in-out;
        }

        .settings-popup.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .popup-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-cyan);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 10px;
        }

        .input-group input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--accent-blue);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--gradient-btn);
            color: #fff;
            padding: 10px;
            font-size: 13px;
        }

        .btn-refresh {
            background: rgba(6, 182, 212, 0.15);
            color: var(--accent-cyan);
            border: 1px solid rgba(6, 182, 212, 0.3);
            margin-bottom: 20px;
        }

        .btn-refresh:hover {
            background: rgba(6, 182, 212, 0.25);
            color: #fff;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.2);
            margin-top: 10px;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #fff;
        }

        .msg-status {
            font-size: 12px;
            text-align: center;
            margin-bottom: 12px;
            display: none;
        }

        .otp-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
        }

        .otp-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--gradient-primary);
        }

        .otp-email {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .otp-subject {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .otp-code-box {
            display: inline-block;
            font-size: 22px;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 2px;
            background: rgba(56, 189, 248, 0.1);
            padding: 4px 12px;
            border-radius: 8px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            margin-bottom: 6px;
        }

        .otp-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="header-title">
                <i class="fa-solid fa-envelope-open-text"></i> OTP Dashboard
            </div>
            
            <button class="settings-btn" id="settingsToggle" title="Add Account Settings">
                <i class="fa-solid fa-gear"></i>
            </button>

            <!-- Hidden Popup Form -->
            <div class="settings-popup" id="settingsPopup">
                <div class="popup-title">
                    <i class="fa-solid fa-user-plus"></i> Add Gmail Account
                </div>
                <form id="addAccountForm">
                    <div class="input-group">
                        <input type="email" id="accEmail" placeholder="Gmail Address" required autocomplete="off">
                    </div>
                    <div class="input-group">
                        <input type="password" id="accPassword" placeholder="16-digit App Password" required autocomplete="off">
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-floppy-disk"></i> Save Account
                    </button>
                </form>
            </div>
        </div>

        <div id="statusMsg" class="msg-status"></div>

        <!-- Refresh Button -->
        <button type="button" class="btn btn-refresh" id="refreshBtn">
            <i class="fa-solid fa-rotate-right" id="refreshIcon"></i> Refresh OTPs
        </button>

        <!-- Container for Dynamic OTP Cards -->
        <div class="otp-container" id="otpContainer">
            <div class="empty-state">
                <i class="fa-solid fa-spinner fa-spin" style="font-size: 24px; margin-bottom: 6px; display: block;"></i>
                Loading OTPs...
            </div>
        </div>

        <!-- Logout Button -->
        <button type="button" class="btn btn-logout" onclick="logout()">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
    </div>

    <script>
        // Master Password configured in app.py
        const MASTER_PASSWORD = "12345";

        const settingsToggle = document.getElementById('settingsToggle');
        const settingsPopup = document.getElementById('settingsPopup');
        const otpContainer = document.getElementById('otpContainer');
        const refreshBtn = document.getElementById('refreshBtn');
        const refreshIcon = document.getElementById('refreshIcon');
        const addAccountForm = document.getElementById('addAccountForm');
        const statusMsg = document.getElementById('statusMsg');

        // Toggle Popup Modal
        settingsToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            settingsPopup.classList.toggle('active');
        });

        document.addEventListener('click', (e) => {
            if (!settingsPopup.contains(e.target) && !settingsToggle.contains(e.target)) {
                settingsPopup.classList.remove('active');
            }
        });

        // Show Temporary Message
        function showMessage(msg, isError = false) {
            statusMsg.style.display = 'block';
            statusMsg.style.color = isError ? 'var(--accent-red)' : 'var(--accent-green)';
            statusMsg.innerText = msg;
            setTimeout(() => {
                statusMsg.style.display = 'none';
            }, 4000);
        }

        // Fetch OTPs from Python API
        async function fetchOTPs() {
            refreshIcon.classList.add('fa-spin');
            try {
                const res = await fetch('/api/fetch-otps', {
                    headers: {
                        'X-Master-Password': MASTER_PASSWORD
                    }
                });

                if (!res.ok) {
                    throw new Error("Failed to fetch OTPs");
                }

                const data = await res.json();
                renderOTPs(data);
            } catch (err) {
                console.error(err);
                otpContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-triangle-exclamation" style="font-size: 24px; color: var(--accent-red); margin-bottom: 6px; display: block;"></i>
                        Error loading OTPs. Check connection or Master Password.
                    </div>`;
            } finally {
                refreshIcon.classList.remove('fa-spin');
            }
        }

        // Render Dynamic Cards
        function renderOTPs(otps) {
            if (!otps || otps.length === 0) {
                otpContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-inbox" style="font-size: 24px; margin-bottom: 6px; display: block;"></i>
                        No OTPs found.
                    </div>`;
                return;
            }

            otpContainer.innerHTML = otps.map(item => `
                <div class="otp-card">
                    <div class="otp-email"><i class="fa-regular fa-envelope"></i> ${item.email}</div>
                    <div class="otp-subject">${item.subject}</div>
                    ${item.code ? `<div class="otp-code-box">OTP: ${item.code}</div>` : ''}
                    <div class="otp-time"><i class="fa-regular fa-clock"></i> Time: ${item.time} | Sender: ${item.sender}</div>
                </div>
            `).join('');
        }

        // Handle Add Account Form Submission
        addAccountForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('accEmail').value;
            const password = document.getElementById('accPassword').value;

            try {
                const res = await fetch('/api/add-account', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Password': MASTER_PASSWORD
                    },
                    body: JSON.stringify({ email, password })
                });

                const result = await res.json();

                if (res.ok) {
                    showMessage(result.message || "Account added successfully!");
                    addAccountForm.reset();
                    settingsPopup.classList.remove('active');
                    fetchOTPs(); // Reload OTPs with new account
                } else {
                    showMessage(result.error || "Failed to add account", true);
                }
            } catch (err) {
                showMessage("Connection error", true);
            }
        });

        refreshBtn.addEventListener('click', fetchOTPs);

        function logout() {
            window.location.href = '/';
        }

        // Load OTPs on startup
        fetchOTPs();
    </script>
</body>
</html>
