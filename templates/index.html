<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail OTP Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(18, 24, 38, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --gradient-primary: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --gradient-btn: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            --shadow-glow: 0 0 25px rgba(59, 130, 246, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(59, 130, 246, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(139, 92, 246, 0.12) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 32px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), var(--shadow-glow);
        }

        /* Top Header Area */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            position: relative;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Settings Icon Button */
        .settings-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .settings-btn:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: var(--accent-blue);
            color: var(--accent-cyan);
            transform: rotate(45deg);
        }

        /* Settings Popup/Modal */
        .settings-popup {
            display: none;
            position: absolute;
            top: 50px;
            right: 0;
            width: 320px;
            background: #111827;
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 100;
            animation: fadeIn 0.2s ease-in-out;
        }

        .settings-popup.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .popup-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-cyan);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 10px;
        }

        .input-group input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--accent-blue);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--gradient-btn);
            color: #fff;
            padding: 10px;
            font-size: 13px;
        }

        .btn-refresh {
            background: rgba(6, 182, 212, 0.15);
            color: var(--accent-cyan);
            border: 1px solid rgba(6, 182, 212, 0.3);
            margin-bottom: 20px;
        }

        .btn-refresh:hover {
            background: rgba(6, 182, 212, 0.25);
            color: #fff;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.2);
            margin-top: 10px;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #fff;
        }

        .msg-success {
            font-size: 12px;
            color: var(--accent-green);
            text-align: center;
            margin-top: 8px;
        }

        .otp-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
        }

        .otp-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--gradient-primary);
        }

        .otp-email {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .otp-subject {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .otp-code-box {
            display: inline-block;
            font-size: 22px;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 2px;
            background: rgba(56, 189, 248, 0.1);
            padding: 4px 12px;
            border-radius: 8px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            margin-bottom: 6px;
        }

        .otp-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Bar with Settings Icon -->
        <div class="top-bar">
            <div class="header-title">
                <i class="fa-solid fa-envelope-open-text"></i> OTP Dashboard
            </div>
            
            <!-- Gear Icon Button -->
            <button class="settings-btn" id="settingsToggle" title="Add Account Settings">
                <i class="fa-solid fa-gear"></i>
            </button>

            <!-- Hidden Add Account Dropdown -->
            <div class="settings-popup" id="settingsPopup">
                <div class="popup-title">
                    <i class="fa-solid fa-user-plus"></i> Add Gmail Account
                </div>
                <form action="/add_account" method="POST">
                    <div class="input-group">
                        <input type="email" name="email" placeholder="Gmail Address" required autocomplete="off">
                    </div>
                    <div class="input-group">
                        <input type="password" name="app_password" placeholder="16-digit App Password" required autocomplete="off">
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-floppy-disk"></i> Save Account
                    </button>
                </form>
            </div>
        </div>

        {% if msg %}
            <div class="msg-success" style="margin-bottom: 15px;">{{ msg }}</div>
        {% endif %}

        <!-- Refresh OTPs Button -->
        <a href="/" style="text-decoration: none;">
            <button type="button" class="btn btn-refresh">
                <i class="fa-solid fa-rotate-right"></i> Refresh OTPs
            </button>
        </a>

        <!-- OTP Cards Container -->
        <div class="otp-container">
            {% if otps %}
                {% for item in otps %}
                    <div class="otp-card">
                        <div class="otp-email"><i class="fa-regular fa-envelope"></i> {{ item.email }}</div>
                        <div class="otp-subject">{{ item.subject }}</div>
                        {% if item.otp %}
                            <div class="otp-code-box">OTP: {{ item.otp }}</div>
                        {% endif %}
                        <div class="otp-time"><i class="fa-regular fa-clock"></i> Time: {{ item.time }}</div>
                    </div>
                {% endfor %}
            {% else %}
                <div class="empty-state">
                    <i class="fa-solid fa-inbox" style="font-size: 24px; margin-bottom: 6px; display: block;"></i>
                    No OTPs found.
                </div>
            {% endif %}
        </div>

        <!-- Logout Button -->
        <a href="/login" style="text-decoration: none;">
            <button type="button" class="btn btn-logout">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </a>
    </div>

    <script>
        const settingsToggle = document.getElementById('settingsToggle');
        const settingsPopup = document.getElementById('settingsPopup');

        if (settingsToggle && settingsPopup) {
            settingsToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                settingsPopup.classList.toggle('active');
            });

            document.addEventListener('click', (e) => {
                if (!settingsPopup.contains(e.target) && !settingsToggle.contains(e.target)) {
                    settingsPopup.classList.remove('active');
                }
            });
        }
    </script>
</body>
</html>
