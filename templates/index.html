<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail OTP Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(18, 24, 38, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --gradient-primary: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --gradient-btn: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            --shadow-glow: 0 0 25px rgba(59, 130, 246, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(59, 130, 246, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(139, 92, 246, 0.12) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 32px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), var(--shadow-glow);
        }

        .hidden { display: none !important; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            position: relative;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .settings-btn:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: var(--accent-blue);
            color: var(--accent-cyan);
            transform: rotate(45deg);
        }

        .settings-popup {
            display: none;
            position: absolute;
            top: 50px;
            right: 0;
            width: 320px;
            background: #111827;
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 100;
            animation: fadeIn 0.2s ease-in-out;
        }

        .settings-popup.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes customSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .rotating {
            display: inline-block;
            animation: customSpin 0.8s linear infinite;
        }

        /* সবুজ পালসিং ডট */
        .new-dot {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #10b981;
            z-index: 5;
        }

        .new-dot::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.4);
            animation: dotPulse 1.5s ease-in-out infinite;
        }

        @keyframes dotPulse {
            0%, 100% { transform: scale(0.8); opacity: 0.6; }
            50% { transform: scale(1.6); opacity: 0; }
        }

        .popup-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-cyan);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
        }

        .input-group { margin-bottom: 12px; }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus { border-color: var(--accent-blue); }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--gradient-btn);
            color: #fff;
        }

        .btn-refresh {
            background: rgba(6, 182, 212, 0.15);
            color: var(--accent-cyan);
            border: 1px solid rgba(6, 182, 212, 0.3);
            margin-bottom: 20px;
        }

        .btn-refresh:hover {
            background: rgba(6, 182, 212, 0.25);
            color: #fff;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.2);
            margin-top: 15px;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #fff;
        }

        .msg-status {
            font-size: 12px;
            text-align: center;
            margin-bottom: 12px;
            display: none;
        }

        .otp-container {
            max-height: 420px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .otp-container::-webkit-scrollbar { width: 5px; }
        .otp-container::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }

        .otp-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
        }

        .otp-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--gradient-primary);
        }

        /* নতুন কার্ডে সবুজ বর্ডার গ্লো */
        .otp-card.is-new {
            border-color: rgba(16, 185, 129, 0.4);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.1);
        }

        .otp-email { 
            font-size: 13px; 
            font-weight: 600; 
            color: var(--accent-cyan); 
            margin-bottom: 6px; 
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .otp-subject { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }

        .otp-code-box {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 3px;
            background: rgba(56, 189, 248, 0.1);
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .otp-code-box:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
            transform: translateY(-1px);
        }

        .otp-code-box:active { transform: scale(0.96); }

        .otp-time { font-size: 11px; color: var(--text-muted); }
        .otp-expiry { font-size: 11px; color: var(--accent-cyan); margin-bottom: 6px; }
        .otp-card.expiring .otp-expiry { color: var(--accent-red); }
        .empty-state { text-align: center; color: var(--text-muted); font-size: 13px; padding: 20px 0; }

        .toast {
            visibility: hidden;
            min-width: 160px;
            background: rgba(16, 185, 129, 0.95);
            color: #fff;
            text-align: center;
            border-radius: 30px;
            padding: 10px 20px;
            position: fixed;
            z-index: 1000;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(8px);
        }

        .toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 35px;
        }
        /* ---- swipe to delete ---- */
        .otp-swipe {
            position: relative;
            overflow: hidden;
            border-radius: 14px;
            margin-bottom: 12px;
        }
        .otp-swipe .otp-card {
            margin-bottom: 0;
            transition: transform 0.2s ease;
            touch-action: pan-y;
            user-select: none;
            -webkit-user-select: none;
        }
        .swipe-delete {
            position: absolute;
            top: 0; left: 0; bottom: 0;
            width: 76px;
            border: none;
            background: rgba(239, 68, 68, 0.92);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.15s ease;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 500;
            padding: 20px;
        }
        .modal-box {
            width: 100%;
            max-width: 340px;
            background: #111827;
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }
        .btn-danger { background: linear-gradient(135deg, #dc2626, #ef4444); color: #fff; }
        .btn-cancel { background: rgba(255,255,255,0.06); color: var(--text-muted); margin-top: 8px; }
        .btn-wait {
            background: rgba(139, 92, 246, 0.15);
            color: #c4b5fd;
            border: 1px solid rgba(139, 92, 246, 0.35);
            margin-bottom: 20px;
        }
        .btn-wait:hover { background: rgba(139, 92, 246, 0.25); color: #fff; }
        .btn-wait.active {
            background: rgba(245, 158, 11, 0.15);
            color: #fcd34d;
            border-color: rgba(245, 158, 11, 0.45);
        }
        .card-refresh {
            margin-left: auto;
            margin-right: 20px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            padding: 4px 7px;
            border-radius: 8px;
        }
        .card-refresh:hover { color: var(--accent-cyan); background: rgba(6, 182, 212, 0.12); }
        #liveStatus { text-align: center; font-size: 12px; margin: 4px 0 10px; color: var(--accent-green); display: none; }

        /* ---- all accounts popup ---- */
        .accounts-box {
            width: 100%;
            max-width: 440px;
            background: #111827;
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }
        .accounts-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            color: #67e8f9;
            font-weight: 700;
            font-size: 15px;
        }
        .accounts-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
        }
        #allContainer { max-height: 62vh; overflow-y: auto; padding-right: 4px; }
        #allContainer::-webkit-scrollbar { width: 5px; }
        #allContainer::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
        #accountCountBar:active { transform: scale(0.98); }

        /* ---- search + pin ---- */
        .acc-search { position: relative; margin-bottom: 12px; }
        .acc-search i.fa-magnifying-glass {
            position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); font-size: 13px; pointer-events: none;
        }
        .acc-search input {
            width: 100%;
            padding: 11px 36px 11px 36px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s ease;
        }
        .acc-search input:focus { border-color: var(--accent-cyan); }
        .acc-search .search-clear {
            position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--text-muted);
            cursor: pointer; font-size: 13px; padding: 6px 8px; display: none;
        }
        .acc-search.has-text .search-clear { display: block; }
        .acc-section {
            font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
            color: var(--text-muted); margin: 4px 2px 8px; display: flex; align-items: center; gap: 6px;
        }
        .acc-section.pinned-label { color: #fbbf24; }
        .card-pin {
            background: none; border: none; color: var(--text-muted);
            cursor: pointer; font-size: 13px; padding: 4px 7px; border-radius: 8px;
            margin-left: auto;
        }
        .card-pin + .card-refresh { margin-left: 0; }
        .card-pin:hover { color: #fbbf24; background: rgba(251, 191, 36, 0.12); }
        .card-pin.pinned { color: #fbbf24; }
        .otp-card.is-pinned { border-color: rgba(251, 191, 36, 0.35); }
        .otp-card.is-pinned::before { background: linear-gradient(135deg, #f59e0b, #fbbf24); }

        /* ---- masked code (tap to reveal) ---- */
        .otp-code-box.masked { letter-spacing: 6px; color: #7dd3fc; }
        .reveal-eye { font-size: 14px; opacity: 0.7; margin-left: 6px; letter-spacing: normal; }

        /* ---- used code (copy kora hoye gele jhapsha + badge) ---- */
        .otp-card.is-used { border-color: rgba(255, 255, 255, 0.08); box-shadow: none; }
        .otp-card.is-used::before { background: rgba(255, 255, 255, 0.18); }
        .otp-card.is-used .otp-email > span:not(.used-badge),
        .otp-card.is-used .otp-expiry,
        .otp-card.is-used .otp-time { opacity: 0.5; }
        .otp-card.is-used .otp-code-box {
            opacity: 0.45; filter: blur(2.5px);
            transition: filter 0.2s ease, opacity 0.2s ease;
        }
        .otp-card.is-used .otp-code-box:hover { opacity: 0.85; filter: blur(0); }   /* dhorle abar poriskar */
        .used-badge {
            margin-left: auto; flex: none;
            display: inline-flex; align-items: center; gap: 5px;
            font: inherit; font-size: 11px; font-weight: 700;
            color: var(--accent-green); background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.35); border-radius: 999px;
            padding: 2px 9px; cursor: pointer; opacity: 1 !important;
        }
        .used-badge:hover { background: rgba(16, 185, 129, 0.22); }
        .otp-card.just-used { animation: usedPop 0.45s ease; }
        @keyframes usedPop { 0% { transform: scale(1); } 40% { transform: scale(0.97); } 100% { transform: scale(1); } }

        /* ---- countdown ring ---- */
        .otp-expiry { display: flex; align-items: center; gap: 6px; }
        .ring { transform: rotate(-90deg); flex: none; }
        .ring-bg { fill: none; stroke: rgba(255, 255, 255, 0.12); stroke-width: 3; }
        .ring-fg {
            fill: none; stroke: var(--accent-cyan); stroke-width: 3; stroke-linecap: round;
            transition: stroke-dashoffset 1s linear, stroke 0.3s ease;
        }
        .otp-card.expiring .ring-fg { stroke: var(--accent-red); }

        /* ---- skeleton loader ---- */
        .skeleton-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .sk {
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.13) 50%, rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.3s linear infinite;
            border-radius: 8px;
        }
        .sk-line { height: 12px; margin-bottom: 12px; }
        .sk-box { height: 50px; margin-bottom: 12px; }
        .sk.w60 { width: 60%; }
        .sk.w40 { width: 40%; margin-bottom: 0; }
        @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

        /* ---- account health ---- */
        .health-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
        .health-dot.ok { background: #10b981; box-shadow: 0 0 6px rgba(16, 185, 129, 0.7); }
        .health-dot.warn { background: #f59e0b; box-shadow: 0 0 6px rgba(245, 158, 11, 0.7); }
        .health-dot.bad { background: #ef4444; box-shadow: 0 0 6px rgba(239, 68, 68, 0.7); }
        .health-msg { font-size: 11px; }
        .health-msg.warn { color: #fcd34d; }
        .health-msg.bad { color: #fca5a5; }
        .health-badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; }
        .health-badge.warn { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.4); }
        .health-badge.bad { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }

        /* ---- Refresh + Wait: ek line-e pashapashi ---- */
        .btn-row { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-row .btn {
            flex: 1 1 0; min-width: 0; margin-bottom: 0;
            padding: 12px 8px; font-size: 13px; line-height: 1.25; text-align: center;
        }

        /* ---- accounts icon button (gear-er pashe) ---- */
        .top-actions { display: flex; align-items: center; gap: 10px; }
        .accounts-btn {
            position: relative; font-size: 16px; color: #67e8f9;
            background: rgba(34, 211, 238, 0.08); border-color: rgba(34, 211, 238, 0.25);
        }
        .accounts-btn:hover { transform: none; background: rgba(34, 211, 238, 0.18); border-color: var(--accent-cyan); }
        .accounts-btn:active { transform: scale(0.94); }
        .count-badge {
            position: absolute; top: -6px; right: -6px;
            min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px;
            background: var(--gradient-btn); color: #fff;
            font-size: 11px; font-weight: 700; line-height: 1;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--bg-color);
        }
        .health-flag {
            position: absolute; bottom: -5px; right: -5px;
            width: 17px; height: 17px; border-radius: 50%;
            font-size: 10px; font-weight: 800; line-height: 1; color: #fff;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--bg-color);
        }
        .health-flag.warn { background: #f59e0b; }
        .health-flag.bad { background: #ef4444; }

        /* ---- auto-copy toggle + keyboard hint ---- */
        .mini-toggle {
            display: block; margin: 8px auto 12px; background: none;
            border: 1px solid var(--card-border); color: var(--text-muted);
            border-radius: 999px; font-size: 12px; padding: 5px 12px; cursor: pointer;
        }
        .mini-toggle.on { color: var(--accent-green); border-color: rgba(16, 185, 129, 0.4); background: rgba(16, 185, 129, 0.08); }
        .kbd-hint { text-align: center; font-size: 11px; color: var(--text-muted); opacity: 0.6; margin-top: 12px; }
        @media (hover: none), (pointer: coarse) { .kbd-hint { display: none; } }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- LOGIN SECTION -->
        <div id="loginSection">
            <div class="header-title" style="justify-content: center; margin-bottom: 20px;">
                <i class="fa-solid fa-lock"></i> Secure Login
            </div>
            <div id="lockNotice" class="msg-status" style="color: #fcd34d;"><i class="fa-solid fa-lock"></i> <span id="lockNoticeText"></span></div>
            <div id="loginError" class="msg-status" style="color: var(--accent-red);"></div>
            <form id="loginForm">
                <div class="input-group">
                    <input type="password" id="masterPasswordInput" placeholder="Enter Master Password" required autocomplete="off">
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-right-to-bracket"></i> Login
                </button>
                <button type="button" class="btn btn-primary hidden" id="passkeyLoginBtn" style="margin-top: 10px;">
                    <i class="fa-solid fa-fingerprint"></i> Login with Fingerprint / Face
                </button>
            </form>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="dashboardSection" class="hidden">
            <div class="top-bar">
                <div class="header-title">
                    <i class="fa-solid fa-envelope-open-text"></i> OTP Dashboard
                </div>
                
                <div class="top-actions">
                    <button type="button" class="settings-btn accounts-btn" id="accountCountBar" title="All Gmail accounts" aria-label="View all Gmail accounts">
                        <i class="fa-solid fa-envelope"></i>
                        <span class="count-badge" id="accountCount">0</span>
                        <span id="healthBadge" class="health-flag hidden"></span>
                    </button>
                    <button class="settings-btn" id="settingsToggle" title="Add Account Settings">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>

                <div class="settings-popup" id="settingsPopup">
                    <div class="settings-auth" id="settingsAuth">
                        <div class="popup-title">
                            <i class="fa-solid fa-lock"></i> Enter Settings Password
                        </div>
                        <form id="settingsAuthForm">
                            <div class="input-group">
                                <input type="password" id="settingsPasswordInput" placeholder="Enter password" required autocomplete="off">
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="fa-solid fa-key"></i> Unlock
                            </button>
                            <button type="button" class="btn btn-primary hidden" id="passkeySettingsBtn" style="margin-top: 8px;">
                                <i class="fa-solid fa-fingerprint"></i> Unlock with Fingerprint / Face
                            </button>
                        </form>
                        <div id="settingsAuthError" class="msg-status" style="color: var(--accent-red); display: none; margin-top: 8px; font-size: 13px;"></div>
                    </div>

                    <div class="settings-content hidden" id="settingsContent">
                        <div class="popup-title">
                            <i class="fa-solid fa-user-plus"></i> Add Gmail Account
                        </div>
                        <button type="button" class="btn btn-primary hidden" id="registerPasskeyBtn" style="margin-bottom: 12px;">
                            <i class="fa-solid fa-fingerprint"></i> Enable Fingerprint / Face on this device
                        </button>
                        <form id="addAccountForm">
                            <div class="input-group">
                                <input type="email" id="accEmail" placeholder="Gmail Address" required autocomplete="off">
                            </div>
                            <div class="input-group">
                                <input type="password" id="accPassword" placeholder="16-digit App Password" required autocomplete="off">
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="fa-solid fa-floppy-disk"></i> Save Account
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div id="statusMsg" class="msg-status"></div>

            <div class="btn-row">
                <button type="button" class="btn btn-refresh" id="refreshBtn">
                    <i class="fa-solid fa-rotate-right" id="refreshIcon"></i> Refresh OTPs
                </button>
                <button type="button" class="btn btn-wait" id="waitBtn">
                    <i class="fa-solid fa-hourglass-start"></i> Wait for new code
                </button>
            </div>
            <div id="autoStatus" style="text-align:center; font-size:12px; opacity:0.65; margin-top:8px;">
                <i class="fa-regular fa-clock"></i> Last updated: --
            </div>
            <div id="liveStatus"></div>
            <button type="button" id="autoCopyBtn" class="mini-toggle on" title="Copy new codes automatically when they arrive live">
                <i class="fa-regular fa-copy"></i> Auto-copy new code: <b>ON</b>
            </button>

            <div class="otp-container" id="otpContainer">
                <div class="empty-state">
                    <i class="fa-solid fa-inbox" style="font-size: 24px; margin-bottom: 6px; display: block;"></i>
                    Click "Refresh OTPs" to load emails.
                </div>
            </div>

            <div class="kbd-hint">R refresh &middot; W wait &middot; C copy &middot; / search &middot; Esc close</div>
            <button type="button" class="btn btn-logout" onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>

    </div>

    <!-- All Gmail accounts popup -->
    <div id="accountsModal" class="modal-overlay hidden">
        <div class="accounts-box">
            <div class="accounts-head">
                <span><i class="fa-solid fa-envelope"></i> All Gmail Accounts (<span id="allCount">0</span>)</span>
                <button type="button" class="accounts-close" id="accountsCloseBtn" title="Close"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="acc-search" id="accSearchWrap">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="accSearchInput" placeholder="Search Gmail by name..." autocomplete="off" spellcheck="false">
                <button type="button" class="search-clear" id="accSearchClear" title="Clear"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="allContainer"></div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="deleteModal" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="popup-title" style="color: var(--accent-red);">
                <i class="fa-solid fa-trash"></i> Remove Gmail
            </div>
            <div id="deleteTarget" style="font-size: 13px; margin-bottom: 14px; word-break: break-all; color: var(--text-main);"></div>
            <form id="deleteForm">
                <div class="input-group">
                    <input type="password" id="deletePasswordInput" placeholder="Enter settings password" required autocomplete="off">
                </div>
                <button type="submit" class="btn btn-danger">
                    <i class="fa-solid fa-trash"></i> Remove with Password
                </button>
            </form>
            <button type="button" class="btn btn-primary hidden" id="deletePasskeyBtn" style="margin-top: 8px;">
                <i class="fa-solid fa-fingerprint"></i> Remove with Fingerprint / Face
            </button>
            <div id="deleteError" class="msg-status" style="color: var(--accent-red); margin: 8px 0 0; font-size: 13px;"></div>
            <button type="button" class="btn btn-cancel" id="deleteCancelBtn">Cancel</button>
        </div>
    </div>

    <div id="toast" class="toast">
        <i class="fa-solid fa-circle-check"></i> <span id="toastMsg">Copied!</span>
    </div>

    <script>
        const loginSection = document.getElementById('loginSection');
        const dashboardSection = document.getElementById('dashboardSection');
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');

        const settingsToggle = document.getElementById('settingsToggle');
        const settingsPopup = document.getElementById('settingsPopup');
        const otpContainer = document.getElementById('otpContainer');
        const allContainer = document.getElementById('allContainer');
        const accountsModal = document.getElementById('accountsModal');
        const refreshBtn = document.getElementById('refreshBtn');
        const addAccountForm = document.getElementById('addAccountForm');
        const statusMsg = document.getElementById('statusMsg');

        const settingsAuth = document.getElementById('settingsAuth');
        const settingsContent = document.getElementById('settingsContent');
        const settingsAuthForm = document.getElementById('settingsAuthForm');
        const settingsPasswordInput = document.getElementById('settingsPasswordInput');
        const settingsAuthError = document.getElementById('settingsAuthError');

        // আগের কোডগুলো মনে রাখার জন্য
        let previousCodes = [];
        let waiting = null;            // "Wait for new code" mode
        let es = null, pushEnabled = null, pushConnected = false, pushRetry = null;
        let helloCount = 0, lastDisconnectAt = 0;
        const WAIT_SECONDS = 120;

        function resetSettingsPopup() {
            settingsAuth.classList.remove('hidden');
            settingsContent.classList.add('hidden');
            settingsPasswordInput.value = '';
            settingsAuthError.style.display = 'none';
            settingsAuthError.innerText = '';
        }

        settingsToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            settingsPopup.classList.toggle('active');
            if (!settingsPopup.classList.contains('active')) {
                resetSettingsPopup();
            }
        });

        function openSettingsContent() {
            settingsAuth.classList.add('hidden');
            settingsContent.classList.remove('hidden');
            settingsAuthError.style.display = 'none';
        }

        function showSettingsError(msg) {
            settingsAuthError.innerText = msg;
            settingsAuthError.style.display = 'block';
        }

        settingsAuthForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = settingsPasswordInput.value.trim();
            try {
                const res = await fetch('/api/settings-unlock', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                if (res.ok) {
                    openSettingsContent();
                } else {
                    let msg = 'Incorrect password. Please try again.';
                    try { const d = await res.json(); if (d && d.error) msg = d.error; } catch (e2) {}
                    showSettingsError(msg);
                }
            } catch (err) {
                showSettingsError('Server Error!');
            }
        });

        document.addEventListener('click', (e) => {
            if (!settingsPopup.contains(e.target) && !settingsToggle.contains(e.target)) {
                settingsPopup.classList.remove('active');
                resetSettingsPopup();
            }
        });

        function showMessage(msg, isError = false) {
            statusMsg.style.display = 'block';
            statusMsg.style.color = isError ? 'var(--accent-red)' : 'var(--accent-green)';
            statusMsg.innerText = msg;
            setTimeout(() => {
                statusMsg.style.display = 'none';
            }, 4000);
        }

        function lightVibrate() {
            try { if (navigator.vibrate) navigator.vibrate(40); } catch (e) {}   // halka ekta tap
        }

        function fallbackCopy(text) {
            // clipboard API na thakle / block hole purono poddhoti
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.cssText = 'position:fixed;top:-1000px;opacity:0;';
            document.body.appendChild(ta);
            ta.select();
            let ok = false;
            try { ok = document.execCommand('copy'); } catch (e) {}
            document.body.removeChild(ta);
            return ok;
        }

        function copyOTP(code, onSuccess) {
            if (!code || code === 'Code not found' || code === 'No emails found') return;
            const done = () => { showToast(`Copied: ${code}`); lightVibrate(); if (onSuccess) onSuccess(); };
            const fail = () => { if (fallbackCopy(code)) done(); else showToast('Could not copy'); };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(code).then(done).catch(fail);
            } else {
                fail();
            }
        }

        let toastTimer = null;
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.innerText = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);   // poroborti toast age bondho na hoy
            toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 2000);
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('masterPasswordInput').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                if (res.ok) {
                    loginSection.classList.add('hidden');
                    dashboardSection.classList.remove('hidden');
                    fetchOTPs();
                } else {
                    let msg = "Wrong Master Password!";
                    try { const d = await res.json(); if (d && d.error) msg = d.error; } catch (e2) {}
                    loginError.style.display = 'block';
                    loginError.innerText = msg;
                }
            } catch (err) {
                loginError.style.display = 'block';
                loginError.innerText = "Server Error!";
            }
        });

        async function loadAccountCount() {
            try {
                const res = await fetch('/api/accounts-count');
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('accountCount').innerText = data.count;
                    document.getElementById('accountCountBar').title = 'All Gmail accounts (' + data.count + ')';
                }
            } catch (err) {}
        }

        let isFetching = false;

        async function fetchOTPs(silent = false) {
            if (isFetching) return;
            isFetching = true;

            if (!silent) {
                loadAccountCount();
                refreshBtn.disabled = true;
                refreshBtn.style.opacity = '0.75';
                refreshBtn.style.cursor = 'not-allowed';
                refreshBtn.innerHTML = `<i class="fa-solid fa-rotate-right rotating"></i> Checking Gmail...`;

                otpContainer.innerHTML = skeletonHTML(2);
            }

            try {
                const res = await fetch('/api/fetch-otps');

                if (res.status === 401) {
                    stopPush(); stopWaiting(false);
                    dashboardSection.classList.add('hidden');
                    loginSection.classList.remove('hidden');
                    return;
                }

                if (!res.ok) throw new Error("Failed");

                const data = await res.json();
                renderOTPs(data);
                syncPins();
                ensurePush();
                const t = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                document.getElementById('autoStatus').innerHTML =
                    `<i class="fa-regular fa-clock"></i> Last updated ${t}`;

            } catch (err) {
                // silent refresh e error hole purono OTP gulo thakbe, kichu muche jabe na
                if (!silent) {
                    otpContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fa-solid fa-triangle-exclamation" style="font-size: 24px; color: var(--accent-red); margin-bottom: 6px; display: block;"></i>
                            Error loading OTPs. Try again.
                        </div>`;
                }
            } finally {
                isFetching = false;
                if (!silent) {
                    refreshBtn.disabled = false;
                    refreshBtn.style.opacity = '1';
                    refreshBtn.style.cursor = 'pointer';
                    refreshBtn.innerHTML = `<i class="fa-solid fa-rotate-right"></i> Refresh OTPs`;
                }
            }
        }

        function escAttr(s) {
            return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // Home-e code tar nijer meyad porjonto dekhabe (server email theke pore, na thakle 2 min). expiresAt = kokhon home theke soribe.
        // (Total Gmail list-e shesh code always thake)
        function normalizeExpiry(item) {
            if (!isValidItem(item)) return item;
            const ttl = item.ttl_seconds ?? 120;
            const age = item.age_seconds ?? 0;
            return { ...item, expiresAt: Date.now() + (ttl - age) * 1000, ttlMs: ttl * 1000 };
        }

        function tickExpiry() {
            let homeExpired = false;
            document.querySelectorAll('#otpContainer .otp-card[data-expires]').forEach(card => {
                const left = Number(card.dataset.expires) - Date.now();
                if (left <= 0) { homeExpired = true; return; }
                const sec = Math.ceil(left / 1000);
                const el = card.querySelector('.otp-expiry-time');
                if (el) el.textContent = fmtLeft(sec);
                const ttlMs = Number(card.dataset.ttl) || 120000;
                card.classList.toggle('expiring', left <= Math.min(20000, ttlMs * 0.25));   // chhoto meyade shobshomoy lal na hoy
                const ring = card.querySelector('.ring-fg');
                if (ring) {
                    ring.style.strokeDashoffset = RING_C * (1 - Math.max(0, Math.min(1, left / ttlMs)));
                }
            });
            if (homeExpired) renderHome();   // code-er nijer meyad shesh -> home theke sore jabe
        }
        setInterval(tickExpiry, 1000);

        // ---- state ----
        let allItems = [];          // shob account (code thak ba na thak)
        let newCardEmails = [];     // home-e "new" dot dekhabe jegulo-te
        let hasLoaded = false;
        const HOME_MAX = 2;         // home-e maximum koyta card

        function isValidItem(item) {
            return !!(item.code && item.code !== 'Code not found' && item.code !== 'No emails found' && item.code !== 'Error');
        }

        function fmtLeft(sec) {
            if (sec >= 3600) {
                return Math.floor(sec / 3600) + ':' + String(Math.floor((sec % 3600) / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
            }
            return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
        }

        // ---------- mask / ring / health helpers ----------
        const MASK_CODES = true;          // true: code "•••" thake, tap korle dekha jay
        const REVEAL_MS = 15000;          // dekhano code koto ms por abar lukabe
        const RING_C = 2 * Math.PI * 10;  // countdown ring-er poridhi (r = 10)
        const revealedAt = new Map();     // codeKey -> kokhon dekhano hoyechhe

        function healthOf(item) {
            if (item.code === 'Error') return /login failed/i.test(item.sender || '') ? 'bad' : 'warn';
            return 'ok';
        }
        const HEALTH_TITLE = { ok: 'Connected', warn: 'Connection problem - try refresh', bad: 'Login failed - check App Password' };

        function codeKey(item) { return item.email + '|' + item.code; }
        function isRevealed(item) {
            if (!MASK_CODES) return true;
            const ts = revealedAt.get(codeKey(item));
            return !!ts && (Date.now() - ts) < REVEAL_MS;
        }
        function maskText(code) { return '•'.repeat(Math.min(String(code).length, 10)); }

        function setBoxRevealed(box, revealed) {
            box.classList.toggle('masked', !revealed);
            if (revealed) {
                box.textContent = box.dataset.code;
                box.title = 'Click to copy';
            } else {
                box.innerHTML = maskText(box.dataset.code) + ' <i class="fa-regular fa-eye reveal-eye"></i>';
                box.title = 'Tap to reveal & copy';
            }
        }

        // ---------- Used code (copy korle "used" hoye jay) ----------
        // Key = email + email-er timestamp. Code-er maan kothao save hoy na (shudhu kon mail-er code).
        const USED_KEY = 'otpDash.used';
        const USED_KEEP_MS = 48 * 3600 * 1000;
        function loadUsed() {
            try {
                const o = JSON.parse(localStorage.getItem(USED_KEY) || '{}');
                const now = Date.now(), out = {};
                if (o && typeof o === 'object') Object.keys(o).forEach(k => { if (now - o[k] < USED_KEEP_MS) out[k] = o[k]; });
                return out;
            } catch (e) { return {}; }
        }
        let usedMap = loadUsed();
        function saveUsed() { try { localStorage.setItem(USED_KEY, JSON.stringify(usedMap)); } catch (e) {} }
        function usedKey(item) { return String(item.email).toLowerCase() + '|' + (item.timestamp || 0); }
        function isUsed(item) { return isValidItem(item) && !!usedMap[usedKey(item)]; }

        let reorderTimer = null;
        function setUsed(key, used) {
            if (used) usedMap[key] = Date.now(); else delete usedMap[key];
            saveUsed();
            // card-ta sathe sathe "used" dekhai; ektu pore home-er ordering thik kori (notun code age)
            document.querySelectorAll('.otp-code-box[data-used-key]').forEach(box => {
                if (box.dataset.usedKey !== key) return;
                const card = box.closest('.otp-card');
                if (!card) return;
                card.classList.toggle('is-used', used);
                if (used) {
                    card.classList.add('just-used');
                    card.querySelector('.new-dot')?.remove();
                    if (!card.querySelector('.used-badge')) {      // badge sathe sathe dekhai
                        const holder = card.querySelector('.otp-email > span:not(.health-dot)');
                        if (holder) holder.insertAdjacentHTML('afterend',
                            `<button type="button" class="used-badge" data-used-key="${escAttr(key)}" title="Tap to mark as unused"><i class="fa-solid fa-check"></i> Used</button>`);
                    }
                }
            });
            clearTimeout(reorderTimer);
            reorderTimer = setTimeout(() => { renderHome(); if (accountsModalOpen()) renderAll(); }, used ? 900 : 0);
        }

        function onCodeTap(box) {
            const code = box.dataset.code;
            if (!code) return;
            if (box.classList.contains('masked')) {
                revealedAt.set(box.dataset.key, Date.now());
                setBoxRevealed(box, true);
            }
            const uk = box.dataset.usedKey;
            copyOTP(code, uk ? () => { if (!usedMap[uk]) setUsed(uk, true); } : null);
        }

        // "Used" badge-e tap korle abar unused (vul kore copy hole)
        document.addEventListener('click', (e) => {
            const b = e.target.closest('.used-badge');
            if (!b) return;
            e.stopPropagation();
            setUsed(b.dataset.usedKey, false);
            showToast('Marked as unused');
        });

        // dekhano code REVEAL_MS por nije abar lukiye jabe
        setInterval(() => {
            if (!MASK_CODES) return;
            const now = Date.now();
            document.querySelectorAll('.otp-code-box[data-key]:not(.masked)').forEach(box => {
                const ts = revealedAt.get(box.dataset.key);
                if (!ts || now - ts >= REVEAL_MS) setBoxRevealed(box, false);
            });
            revealedAt.forEach((ts, k) => { if (now - ts > REVEAL_MS) revealedAt.delete(k); });
        }, 1000);

        // tab theke soresh gele sathe sathe shob code lukiye felo
        document.addEventListener('visibilitychange', () => {
            if (!MASK_CODES || document.visibilityState !== 'hidden') return;
            revealedAt.clear();
            document.querySelectorAll('.otp-code-box[data-key]:not(.masked)').forEach(box => setBoxRevealed(box, false));
        });

        function updateHealthBadge() {
            const el = document.getElementById('healthBadge');
            if (!el) return;
            const bad = allItems.filter(i => healthOf(i) === 'bad').length;
            const warn = allItems.filter(i => healthOf(i) === 'warn').length;
            const n = bad + warn;
            if (!n) { el.className = 'health-flag hidden'; return; }
            el.className = 'health-flag ' + (bad ? 'bad' : 'warn');
            el.textContent = '!';
            el.title = n + ' account(s) need attention';
        }

        function skeletonHTML(n) {
            return Array.from({ length: n || 2 }, () => `
                <div class="skeleton-card">
                    <div class="sk sk-line w60"></div>
                    <div class="sk sk-box"></div>
                    <div class="sk sk-line w40"></div>
                </div>`).join('');
        }

        function cardHTML(item, opts) {
            const validCode = isValidItem(item);
            const isNew = !!opts.isNew;
            const withTimer = validCode && !!opts.showExpiry;
            const leftMs = withTimer ? Math.max(0, item.expiresAt - Date.now()) : 0;
            const ttlMs = item.ttlMs || 120000;
            const leftSec = Math.ceil(leftMs / 1000);
            const ringOffset = RING_C * (1 - Math.max(0, Math.min(1, leftMs / ttlMs)));
            const revealed = validCode && isRevealed(item);
            const used = validCode && isUsed(item);
            const uKey = validCode ? usedKey(item) : '';
            const health = healthOf(item);
            const pinned = isPinned(item.email);
            const pinBtn = opts.pinnable
                ? `<button type="button" class="card-pin ${pinned ? 'pinned' : ''}" data-email="${escAttr(item.email)}" title="${pinned ? 'Unpin' : 'Pin to top'}"><i class="fa-${pinned ? 'solid' : 'regular'} fa-star"></i></button>`
                : '';
            const healthDot = opts.pinnable
                ? `<span class="health-dot ${health}" title="${escAttr(HEALTH_TITLE[health])}"></span>`
                : '';
            const infoLine = health === 'ok'
                ? `<i class="fa-regular fa-clock"></i> Time: ${item.time || 'N/A'} | Sender: ${escAttr(item.sender || 'N/A')}`
                : `<span class="health-msg ${health}"><i class="fa-solid fa-triangle-exclamation"></i> ${escAttr(item.sender || HEALTH_TITLE[health])}</span>`;
            const codeBox = validCode
                ? `<div class="otp-code-box ${revealed ? '' : 'masked'}" data-code="${escAttr(item.code)}" data-key="${escAttr(codeKey(item))}" data-used-key="${escAttr(uKey)}" onclick="onCodeTap(this)" title="${revealed ? 'Click to copy' : 'Tap to reveal & copy'}">${revealed ? escAttr(item.code) : maskText(item.code) + ' <i class="fa-regular fa-eye reveal-eye"></i>'}</div>`
                : `<div class="otp-code-box" style="cursor: default; opacity: 0.6; font-size: 14px; letter-spacing: normal;">${escAttr(item.code || 'Code not found')}</div>`;
            const expiryRow = withTimer
                ? `<div class="otp-expiry"><svg class="ring" viewBox="0 0 26 26" width="26" height="26"><circle class="ring-bg" cx="13" cy="13" r="10"/><circle class="ring-fg" cx="13" cy="13" r="10" stroke-dasharray="${RING_C.toFixed(2)}" stroke-dashoffset="${ringOffset.toFixed(2)}"/></svg> Expires in <span class="otp-expiry-time">${fmtLeft(leftSec)}</span></div>`
                : '';
            const usedBadge = used
                ? `<button type="button" class="used-badge" data-used-key="${escAttr(uKey)}" title="Tap to mark as unused"><i class="fa-solid fa-check"></i> Used</button>`
                : '';
            const card = `
                <div class="otp-card ${isNew && !used ? 'is-new' : ''} ${used ? 'is-used' : ''} ${opts.pinnable && pinned ? 'is-pinned' : ''}" ${withTimer ? `data-expires="${item.expiresAt}" data-ttl="${ttlMs}"` : ''}>
                    ${isNew && !used ? '<div class="new-dot"></div>' : ''}
                    <div class="otp-email">
                        ${healthDot}
                        <span>${escAttr(item.email)}</span>
                        ${usedBadge}
                        ${pinBtn}
                        <button type="button" class="card-refresh" data-email="${escAttr(item.email)}" title="Refresh only this account"><i class="fa-solid fa-rotate-right"></i></button>
                    </div>
                    ${codeBox}
                    ${expiryRow}

                if (!migrated) {

                            body: JSON.stringify({ emails: local })
                        });
                        if (!r2.ok) return;                       // porer bar abar chesta korbe
                        list = (await r2.json()).pins || list;
                    }
                    try { localStorage.setItem(PIN_MIGRATED, '1'); } catch (e) {}
                }
                setPinsFromServer(list);

        }

        let audioCtx = null;

        function beep() {
            try {
                if (!audioCtx) return;
                [[880, 0], [1175, 0.22]].forEach(([freq, delay]) => {
                    const t0 = audioCtx.currentTime + delay;
                    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                    o.type = 'sine'; o.frequency.value = freq; g.gain.value = 0.08;
                    o.connect(g); g.connect(audioCtx.destination);
                    o.start(t0); o.stop(t0 + 0.18);
                });
            } catch (e) {}
        }

        async function copyQuiet(text) {

        // ======================= ekta account-er item merge kora =======================
        function applyItem(raw, fromPush) {
            const item = normalizeExpiry(raw);
            const i = allItems.findIndex(x => x.email === item.email);
            const prev = i >= 0 ? allItems[i] : null;
            // temporary error diye thik code muche felbo na
            if (item.code === 'Error' && prev && isValidItem(prev)) return;

            const isNewCode = isValidItem(item) && item.expiresAt > Date.now() && (!prev || prev.code !== item.code);
            if (i >= 0) allItems[i] = item; else allItems.push(item);
            allItems.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            const pi = previousCodes.findIndex(x => x.email === item.email);
            if (pi >= 0) previousCodes[pi].code = item.code;
            else previousCodes.push({ email: item.email, code: item.code });

            if (isNewCode && !newCardEmails.includes(item.email)) newCardEmails.push(item.email);

            renderHome();
            if (accountsModalOpen()) renderAll();

            if (isNewCode) {
                if (waiting) stopWaiting(true, item.email);

            }

        async function ensurePush() {
            if (es || pushRetry) return;
            if (pushEnabled === null) {
                try {
                    const r = await fetch('/api/push-status');
                    const d = await r.json();
                    pushEnabled = !!d.enabled;
                } catch (e) { return; }
            }
            if (!pushEnabled || !dashboardIsOpen()) return;

            es = new EventSource('/api/stream');
            es.addEventListener('hello', () => {
                pushConnected = true;
                updateLive();
                // beshi somoy connection na thakle ei fake-e asha notun code miss hote pare -> ekbar sync
                if (helloCount++ > 0 && lastDisconnectAt && Date.now() - lastDisconnectAt > 20000) fetchOTPs(true);
                lastDisconnectAt = 0;
            });
            es.addEventListener('otp', (ev) => {
                try { applyItem(JSON.parse(ev.data), true); } catch (e) {}
            });
            es.addEventListener('expired', () => autoLock('Session expired. Please login again.'));
            es.onerror = () => {
                pushConnected = false;
                updateLive();
                if (!lastDisconnectAt) lastDisconnectAt = Date.now();
                if (es && es.readyState === EventSource.CLOSED) {      // browser ar nije reconnect korbe na
                    es.close(); es = null;
                    pushRetry = setTimeout(() => { pushRetry = null; ensurePush(); }, 15000);
                }
            };
        }

        function stopPush() {

        function b64uToBuf(s) {
            s = s.replace(/-/g, '+').replace(/_/g, '/');
            s += '='.repeat((4 - (s.length % 4)) % 4);
            return Uint8Array.from(atob(s), c => c.charCodeAt(0)).buffer;
        }
        function bufToB64u(buf) {
            let bin = '';
            new Uint8Array(buf).forEach(b => bin += String.fromCharCode(b));
            return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        async function passkeyRegister() {
            const optRes = await fetch('/api/passkey/register/options', { method: 'POST' });
            const opts = await optRes.json();
            if (!optRes.ok) throw new Error(opts.error || 'Failed');
            opts.challenge = b64uToBuf(opts.challenge);
            opts.user.id = b64uToBuf(opts.user.id);
            (opts.excludeCredentials || []).forEach(c => c.id = b64uToBuf(c.id));

            const cred = await navigator.credentials.create({ publicKey: opts });
            const payload = {
                id: cred.id,
                rawId: bufToB64u(cred.rawId),
                type: cred.type,
                response: {
                    clientDataJSON: bufToB64u(cred.response.clientDataJSON),
                    attestationObject: bufToB64u(cred.response.attestationObject),
                    transports: cred.response.getTransports ? cred.response.getTransports() : []
                },
                clientExtensionResults: cred.getClientExtensionResults ? cred.getClientExtensionResults() : {}
            };
            const res = await fetch('/api/passkey/register/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Failed');
        }

        async function passkeyAuth(purpose) {
            const optRes = await fetch('/api/passkey/auth/options', { method: 'POST' });
            const opts = await optRes.json();
            if (!optRes.ok) throw new Error(opts.error || 'Failed');
            opts.challenge = b64uToBuf(opts.challenge);
            // transports:['internal'] = shudhu ei device-er passkey. Tahole Chrome "phone/security key"
            // bachai-er list na dekhiye shora-shori PIN / fingerprint / face chay.
            (opts.allowCredentials || []).forEach(c => { c.id = b64uToBuf(c.id); c.transports = ['internal']; });

            const cred = await navigator.credentials.get({ publicKey: opts });
            const credential = {
                id: cred.id,
                rawId: bufToB64u(cred.rawId),
                type: cred.type,
                response: {
                    clientDataJSON: bufToB64u(cred.response.clientDataJSON),
                    authenticatorData: bufToB64u(cred.response.authenticatorData),
                    signature: bufToB64u(cred.response.signature),
                    userHandle: cred.response.userHandle ? bufToB64u(cred.response.userHandle) : null
                },
                clientExtensionResults: cred.getClientExtensionResults ? cred.getClientExtensionResults() : {}
            };
            const res = await fetch('/api/passkey/auth/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ purpose, credential })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Failed');
        }

        // ---------- Swipe to delete ----------
        const OPEN_W = 76;
        let swipe = null;
        let openWrap = null;

        function setSwipe(wrap, open) {
            const card = wrap.querySelector('.otp-card');
            const btn = wrap.querySelector('.swipe-delete');
            card.style.transform = open ? `translateX(${OPEN_W}px)` : '';
            btn.style.opacity = open ? '1' : '0';
            wrap.classList.toggle('open', open);
            openWrap = open ? wrap : (openWrap === wrap ? null : openWrap);
        }

        allContainer.addEventListener('pointerdown', (e) => {
            const card = e.target.closest('.otp-card');
            if (!card) return;
            const wrap = card.parentElement;
            if (openWrap && openWrap !== wrap) setSwipe(openWrap, false);
            swipe = {
                wrap, card, id: e.pointerId,
                startX: e.clientX, startY: e.clientY,
                base: wrap.classList.contains('open') ? OPEN_W : 0,
                horizontal: null, x: 0
            };
        });

        allContainer.addEventListener('pointermove', (e) => {
            if (!swipe || e.pointerId !== swipe.id) return;
            const dx = e.clientX - swipe.startX;
            const dy = e.clientY - swipe.startY;
            if (swipe.horizontal === null) {
                if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
                swipe.horizontal = Math.abs(dx) > Math.abs(dy);
                if (swipe.horizontal) {
                    try { swipe.card.setPointerCapture(e.pointerId); } catch (err) {}
                    swipe.card.style.transition = 'none';
                }
            }
            if (!swipe.horizontal) return;
            swipe.x = Math.max(0, Math.min(OPEN_W + 20, swipe.base + dx));
            swipe.card.style.transform = `translateX(${swipe.x}px)`;
            swipe.wrap.querySelector('.swipe-delete').style.opacity = Math.min(swipe.x / 50, 1);
        });

        function endSwipe() {
            if (!swipe) return;
            const s = swipe;
            swipe = null;
            if (!s.horizontal) return;
            s.card.style.transition = '';
            setSwipe(s.wrap, s.x > OPEN_W / 2);
            s.wrap.dataset.dragged = '1';
            setTimeout(() => { delete s.wrap.dataset.dragged; }, 80);
        }
        allContainer.addEventListener('pointerup', endSwipe);
        allContainer.addEventListener('pointercancel', endSwipe);

        // drag-er por ba khola obosthay click holey OTP copy hobe na
        allContainer.addEventListener('click', (e) => {
            const wrap = e.target.closest('.otp-swipe');
            if (!wrap) return;
            if (wrap.dataset.dragged === '1') { e.stopPropagation(); e.preventDefault(); return; }
            const pinBtn = e.target.closest('.card-pin');
            if (pinBtn && !wrap.classList.contains('open')) {
                e.stopPropagation(); e.preventDefault();

            }
            const delBtn = e.target.closest('.swipe-delete');
            if (delBtn) {
                openDeleteModal(delBtn.dataset.email);

            }
            if (wrap.classList.contains('open')) {
                e.stopPropagation(); e.preventDefault();
                setSwipe(wrap, false);
            }
        }, true);

        document.addEventListener('click', (e) => {
            if (openWrap && !openWrap.contains(e.target)) setSwipe(openWrap, false);
        });

        // ---------- Delete Gmail (password / fingerprint) ----------
        const deleteModal = document.getElementById('deleteModal');
        const deleteTarget = document.getElementById('deleteTarget');
        const deleteForm = document.getElementById('deleteForm');
        const deletePasswordInput = document.getElementById('deletePasswordInput');
        const deletePasskeyBtn = document.getElementById('deletePasskeyBtn');
        const deleteError = document.getElementById('deleteError');
        let deleteTargetEmail = null;

        if (window.PublicKeyCredential) deletePasskeyBtn.classList.remove('hidden');

        function deleteModalOpen() { return !deleteModal.classList.contains('hidden'); }

        function openDeleteModal(email) {
            deleteTargetEmail = email;
            deleteTarget.innerText = email;
            deletePasswordInput.value = '';
            deleteError.style.display = 'none';
            deleteModal.classList.remove('hidden');
            setTimeout(() => deletePasswordInput.focus(), 50);
        }

        function closeDeleteModal() {
            deleteModal.classList.add('hidden');
            deleteTargetEmail = null;
            deletePasswordInput.value = '';
            if (openWrap) setSwipe(openWrap, false);
        }

        function showDeleteError(msg) {
            deleteError.innerText = msg;
            deleteError.style.display = 'block';
        }

        function removeCardFromScreen(email) {
            const wrap = [...allContainer.querySelectorAll('.otp-swipe')]
                .find(w => w.querySelector('.swipe-delete').dataset.email === email);
            previousCodes = previousCodes.filter(p => p.email !== email);
            allItems = allItems.filter(i => i.email !== email);
            newCardEmails = newCardEmails.filter(e => e !== email);
            pinnedEmails = pinnedEmails.filter(x => x !== String(email).toLowerCase());
            savePins();
            if (openWrap === wrap) openWrap = null;
            renderHome();
            document.getElementById('allCount').innerText = allItems.length;
            if (wrap) {
                wrap.style.transition = 'opacity 0.25s ease';
                wrap.style.opacity = '0';
                setTimeout(() => {
                    wrap.remove();
                    if (!allContainer.querySelector('.otp-swipe')) renderAll();
                }, 260);
            }
            loadAccountCount();
        }

        async function deleteAccountRequest(email, extra) {
            const res = await fetch('/api/delete-account', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, ...extra })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Failed');
        }

        deleteForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = deleteTargetEmail;
            try {
                await deleteAccountRequest(email, { password: deletePasswordInput.value });
                closeDeleteModal();
                removeCardFromScreen(email);
                showToast('Gmail removed');
            } catch (err) {
                showDeleteError(err.message || 'Failed');
            }
        });

        deletePasskeyBtn.addEventListener('click', async () => {
            const email = deleteTargetEmail;
            try {
                await passkeyAuth('delete');
                await deleteAccountRequest(email, { use_passkey: true });
                closeDeleteModal();
                removeCardFromScreen(email);
                showToast('Gmail removed');
            } catch (err) {
                showDeleteError(err.message || 'Fingerprint verification failed');
            }
        });

        document.getElementById('deleteCancelBtn').addEventListener('click', closeDeleteModal);
        deleteModal.addEventListener('click', (e) => { if (e.target === deleteModal) closeDeleteModal(); });

        // ---------- Auto refresh ----------
        const AUTO_REFRESH_ENABLED = false;  // true korle auto-refresh abar chalu hobe
        const AUTO_REFRESH_SECONDS = 30;   // koto sekende ekbar check hobe
        const AUTO_IDLE_MINUTES = 2;       // koto minute kichu na korle auto-refresh thambe
        let lastActivity = Date.now();
        let autoPaused = false;

        function dashboardIsOpen() {
            return !dashboardSection.classList.contains('hidden');
        }

        function setAutoStatus(html) {
            document.getElementById('autoStatus').innerHTML = html;
        }

        function autoRefreshAllowed() {
            return dashboardIsOpen() && document.visibilityState === 'visible'
                && !deleteModalOpen() && !openWrap && !autoPaused;
        }

        // Shudhu click / tap / key / scroll ke "kaj kora" dhora hoy.
        // Mouse bhul kore nare gele bondho hoye thaka auto-refresh abar chalu hobe na.
        function markActivity() {
            if (autoPaused) return;
            lastActivity = Date.now();
        }
        ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(ev =>
            document.addEventListener(ev, markActivity, { passive: true }));

        function resumeAutoRefresh() {
            autoPaused = false;
            lastActivity = Date.now();
            setAutoStatus('<i class="fa-solid fa-bolt"></i> Auto-refresh ON');
            fetchOTPs(true);
        }

        setInterval(() => {
            if (!AUTO_REFRESH_ENABLED) return;
            if (!dashboardIsOpen()) {
                // logout / session shesh hole abar notun kore shuru
                autoPaused = false;
                lastActivity = Date.now();
                return;
            }
            if (document.visibilityState !== 'visible') return;
            if (!autoPaused && Date.now() - lastActivity > AUTO_IDLE_MINUTES * 60 * 1000) {
                autoPaused = true;
                setAutoStatus('<i class="fa-solid fa-pause"></i> Auto-refresh paused &middot; ' +
                    '<button type="button" onclick="resumeAutoRefresh()" ' +
                    'style="background:none;border:none;color:#22d3ee;font-weight:700;font-size:12px;cursor:pointer;text-decoration:underline;">Resume</button>');
                return;
            }
            if (autoRefreshAllowed()) fetchOTPs(true);
        }, AUTO_REFRESH_SECONDS * 1000);

        // tab-e fire asle sathe sathe ekbar update
        document.addEventListener('visibilitychange', () => {
            if (AUTO_REFRESH_ENABLED && document.visibilityState === 'visible' && autoRefreshAllowed()) {
                fetchOTPs(true);
            }
        });

        // ---------- Auto-copy toggle ----------
        let autoCopyOn = true;
        try { autoCopyOn = localStorage.getItem('otpDash.autoCopy') !== '0'; } catch (e) {}
        const autoCopyBtn = document.getElementById('autoCopyBtn');
        function renderAutoCopyBtn() {
            autoCopyBtn.classList.toggle('on', autoCopyOn);
            autoCopyBtn.querySelector('b').textContent = autoCopyOn ? 'ON' : 'OFF';
        }
        autoCopyBtn.addEventListener('click', () => {
            autoCopyOn = !autoCopyOn;
            try { localStorage.setItem('otpDash.autoCopy', autoCopyOn ? '1' : '0'); } catch (e) {}
            renderAutoCopyBtn();
            showToast('Auto-copy ' + (autoCopyOn ? 'ON' : 'OFF'));
        });
        renderAutoCopyBtn();

        // ---------- Keyboard shortcuts (desktop) ----------
        function typingInField(t) {
            return !!t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
        }
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            if (e.key === 'Escape') {
                if (deleteModalOpen()) { closeDeleteModal(); return; }
                if (accountsModalOpen()) {
                    if (document.activeElement === accSearchInput && accSearchInput.value) {
                        accSearchInput.value = '';
                        accSearchWrap.classList.remove('has-text');
                        renderAll();
                    } else {
                        closeAccountsModal();
                    }
                    return;
                }
                if (settingsPopup.classList.contains('active')) {
                    settingsPopup.classList.remove('active');
                    resetSettingsPopup();
                }
                return;
            }
            if (!dashboardIsOpen() || deleteModalOpen()) return;
            if (e.key === '/' && !typingInField(e.target)) {
                e.preventDefault();
                if (!accountsModalOpen()) openAccountsModal();
                accSearchInput.focus();
                return;
            }
            if (typingInField(e.target) || accountsModalOpen()) return;
            const k = e.key.toLowerCase();
            if (k === 'r') {
                e.preventDefault();
                fetchOTPs();
            } else if (k === 'w') {
                e.preventDefault();
                waiting ? stopWaiting(false) : startWaiting();
            } else if (k === 'c') {
                const first = allItems.find(i => isValidItem(i) && i.expiresAt > Date.now());
                if (first) { e.preventDefault(); copyOTP(first.code); }
                else showToast('No active code to copy');
            }
        });

        // ---------- Auto-lock: kichu na korle nije logout ----------
        const AUTO_LOCK_MINUTES = 5;           // koto minute kichu na korle auto logout
        const AUTO_LOCK_WARN_SECONDS = 30;     // logout-er koto sekend age hushiyar
        let lockLastActive = Date.now();
        let lockWarned = false;
        let locking = false;
        const lockNotice = document.getElementById('lockNotice');

        // click / tap / key / scroll = kaj kora. (mouse nare gele dhora hoy na)
        function markLockActivity() {
            lockLastActive = Date.now();
            lockWarned = false;
        }
        ['pointerdown', 'keydown', 'touchstart', 'scroll', 'wheel'].forEach(ev =>
            document.addEventListener(ev, markLockActivity, { passive: true, capture: true }));

        loginSection.addEventListener('pointerdown', () => { lockNotice.style.display = 'none'; });

        async function autoLock(reason) {
            if (locking) return;
            locking = true;
            try {
                // shob khola popup / sensitive jinish bondho
                settingsPopup.classList.remove('active');
                resetSettingsPopup();
                closeDeleteModal();
                otpContainer.innerHTML = '';
                allContainer.innerHTML = '';
                await logout();
                document.getElementById('lockNoticeText').innerText =
                    reason || `Locked after ${AUTO_LOCK_MINUTES} minutes of inactivity. Please login again.`;
                lockNotice.style.display = 'block';
                loginError.style.display = 'none';
            } finally {
                locking = false;
                lockLastActive = Date.now();
                lockWarned = false;
            }
        }

        // Keep-alive: user kaj korle ~1 min-e server-ke jani, jate server-er idle timeout-o reset hoy.
        // User kichu na korle ping jay na -> server-o ekshomoy session shesh kore dey.
        const PING_EVERY_MS = 60 * 1000;
        let lastPingAt = Date.now();
        setInterval(async () => {
            if (!dashboardIsOpen() || locking) return;
            if (lockLastActive <= lastPingAt) return;      // ager ping-er por kichu kora hoyni
            lastPingAt = Date.now();
            try {
                const res = await fetch('/api/ping', { method: 'POST' });
                if (res.status === 401) autoLock('Session expired. Please login again.');
            } catch (e) {}
        }, PING_EVERY_MS);

        function checkAutoLock() {
            if (!dashboardIsOpen()) {           // login screen-e thakle timer cholbe na
                lockLastActive = Date.now();
                lockWarned = false;
                return;
            }
            const idleMs = Date.now() - lockLastActive;
            const limitMs = AUTO_LOCK_MINUTES * 60 * 1000;
            if (idleMs >= limitMs) { autoLock(); return; }
            if (!lockWarned && idleMs >= limitMs - AUTO_LOCK_WARN_SECONDS * 1000) {
                lockWarned = true;
                showToast(`Auto-lock in ${AUTO_LOCK_WARN_SECONDS}s - tap to stay logged in`);
            }
        }
        setInterval(checkAutoLock, 1000);
        // background tab-e timer slow hoy -> tab-e fire ashar sathe sathe check
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') checkAutoLock();
        });

        async function logout() {
            try { await fetch('/api/logout', { method: 'POST' }); } catch (e) {}   // network na thakleo UI lock hobe
            dashboardSection.classList.add('hidden');
            loginSection.classList.remove('hidden');
            document.getElementById('masterPasswordInput').value = '';
            previousCodes = [];
            allItems = [];
            newCardEmails = [];
            hasLoaded = false;
            updateHealthBadge();
            stopPush();
            stopWaiting(false);
            closeAccountsModal();
            autoPaused = false;
            lastActivity = Date.now();
        }
    </script>
</body>
</html>
